# --- Listing text ---------------------------------------------------------------------------
# [storefront.metadata] is the default locale's (en) text; every other locale's table carries
# what differs, and inherits the rest (the name and the URLs are set once, here). Arabic lives
# in store/storefront.ar.toml, the same tables in a file of their own; the Chinese description is a
# `-ref`, a project file a translator edits without touching this one. A target's or a store's
# `metadata` table below specializes the wording for that storefront alone.
[storefront.metadata]
name = "Day Showcase"
subtitle = "Day App Dev Framework Demo"
short = "Live demos of the Day framework: native widgets from one Rust codebase."
description = """
Day Showcase is the demo app for Day (daybrite.dev), a framework for creating mobile and desktop apps in Rust.

Each screen in the app is a demonstration of one part of the framework:

Controls: buttons, switches, sliders, steppers, pickers, text fields, a multi-line editor, date and time pickers, keyboard focus, and pointer cursors.
Layout: rows, columns, and layers under each fit policy, and a grid with spanning cells.
Navigation & chrome: a push stack, tabs, menus and dialogs, the window toolbar, and a content list that opens each item in an editor.
Data: a list and a tree over live models, and queries against a local store.
Graphics & media: shapes, paths, gradients, and transforms on a canvas, animation, Lottie playback, bundled resources, media playback, a map, and a web view.
Platform: battery and connectivity, accelerometer, gyroscope, and magnetometer traces, HTTP requests, notifications and the app badge, speech and haptics, and files.
App & tooling: localization, scripting, tweaks, a benchmark against SwiftUI, and crash reporting.

The toolbar on every page has a code button that opens that page's Rust source on GitHub, so you can read the code beside the result. The star button pins a page to the top of the list, and the theme button switches the appearance.

The app is translated into English, French, Arabic, and Simplified Chinese. Switching the language on the Localization page updates every page in place, and Arabic mirrors the layout.

Day and this app are open source. The framework is at github.com/daybrite/day and the app's source is at github.com/daybrite/Day-Showcase. Each page in the app contains a link to the underlying source code.

"""
keywords = ["rust", "native", "ui", "widgets", "framework", "cross-platform", "uikit", "demo", "sample", "developer", "toolkit"]
release-notes = "First App Store release. 35 pages in eight groups, from controls and layout to sensors and crash reporting, in English, French, Arabic, and Simplified Chinese."
marketing-url = "https://daybrite.dev"
support-url = "https://github.com/daybrite/day/issues"
privacy-url = "https://daybrite.dev/privacy"

[storefront.metadata.fr]
subtitle = "Démo du framework d'apps Day"
short = "Démos en direct du framework Day : des widgets natifs, une seule base Rust."
description = """
Day Showcase est l'application de démonstration de Day (daybrite.dev), un framework pour créer des applications mobiles et de bureau en Rust.

Chaque écran de l'application est une démonstration d'une partie du framework :

Contrôles : boutons, interrupteurs, curseurs, compteurs, sélecteurs, champs de texte, un éditeur multiligne, des sélecteurs de date et d'heure, le focus clavier et les curseurs de pointeur.
Mise en page : lignes, colonnes et couches selon chaque règle d'ajustement, et une grille avec des cellules fusionnées.
Navigation et interface : une pile de navigation, des onglets, des menus et des dialogues, la barre d'outils de la fenêtre, et une liste de contenu qui ouvre chaque élément dans un éditeur.
Données : une liste et un arbre sur des modèles vivants, et des requêtes sur un stockage local.
Graphismes et médias : formes, tracés, dégradés et transformations sur un canevas, animation, lecture Lottie, ressources embarquées, lecture de médias, une carte et une vue web.
Plateforme : batterie et connectivité, relevés de l'accéléromètre, du gyroscope et du magnétomètre, requêtes HTTP, notifications et pastille de l'application, synthèse vocale et retour haptique, et fichiers.
Application et outillage : localisation, scripts, réglages, un banc d'essai face à SwiftUI, et rapports de plantage.

La barre d'outils de chaque page comporte un bouton code qui ouvre le code Rust de cette page sur GitHub, pour lire le code à côté du résultat. Le bouton étoile épingle une page en haut de la liste, et le bouton thème change l'apparence.

L'application est traduite en anglais, français, arabe et chinois simplifié. Changer de langue sur la page Localisation met à jour chaque page sur place, et l'arabe inverse la mise en page.

Day et cette application sont open source. Le framework est sur github.com/daybrite/day et le code de l'application sur github.com/daybrite/Day-Showcase. Chaque page de l'application contient un lien vers son code source.

"""
keywords = ["rust", "natif", "interface", "framework", "widgets", "multiplateforme", "développeur", "démo", "uikit", "material"]
release-notes = "Première version sur l'App Store. 35 pages en huit groupes, des contrôles et de la mise en page jusqu'aux capteurs et aux rapports de plantage, en anglais, français, arabe et chinois simplifié."

