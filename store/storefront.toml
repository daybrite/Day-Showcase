# Store listing metadata that is not localized. The localized text lives in store/<locale>/.
#
# [storefront.submission-info] is shared by every store; a target's submission-info and a
# store's override it key by key. bundle-id is omitted, so `day store` falls back to the
# Day.toml [app] id, which the app builds with; set it here only to publish under an id the app
# does not build with.
#
# Screenshots: per target, [storefront.<target>.screenshots] is what the website's page for the
# target shows, one row per device kind (`default` for the kinds not named), and what its stores
# fall back to; [storefront.<target>.<store>.screenshots] is the store's own set. A name is the
# light capture of a dayscript `screenshot:` step; { name = "…", theme = "dark" } the dark one.
# Store keys the CLI does not stage (altstore, f-droid, mac-app-store, …) ride through
# gallery.json for whatever publishes there. `day lint` checks every name against the dayscripts.

[storefront.submission-info]
copyright = "2026 Daybrite"
contact-email = "hello@daybrite.dev"
review-notes = """
Day Showcase is a demonstration app for the Day UI framework. Every screen is reachable from the
navigation list on the first launch; no account, network connection, or configuration is needed.

The Device & sensors page requests camera, location and motion permissions to demonstrate how a
permission prompt looks on this platform. Declining every prompt leaves the rest of the app fully
usable — the page shows the denied state instead of the sensor values.
"""

