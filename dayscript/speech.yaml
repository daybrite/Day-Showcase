name: speech
description: >
  The daybridge reference part (docs/bridge.md): day-part-speech declares one API and implements it
  in Swift on Apple, Java on Android, ArkTS on HarmonyOS, JavaScript on the web and C on Linux.
  This drives the Speech section on the Platform services page: it types a line, speaks it, and
  stops it. The state line under the buttons is the bridge's callback tier (docs/bridge.md
  "Callbacks"): the engine reports the end of the utterance back through the token it was handed,
  so stopping mid-sentence must settle the line on "Stopped". Hearing the voice is still the
  acceptance test for the sound itself; this run proves the section renders on every target,
  reports the support the part claims for it, and that a completion crosses the bridge.
flow:
  - wait_for: { id: nav }
  - navigate: { route: speech }
  - assert_route: { route: speech }
  # The support label is the part's own answer for this target — Native, Emulated, or Unsupported.
  - wait_for: { id: speech-support }
  - screenshot:
      name: speech
      title: { en: "Speech", fr: "Voix", ar: "الكلام", zh-CN: "语音" }
      source: src/pages/services.rs
  # Empty means "speak the localized sample the placeholder shows"; typing overrides it.
  - input: { id: speech-text, text: "Day speaks through the bridge." }
  - tap: { id: speech-speak }
  - assert_text: { id: speech-state, text: "Speaking…", skip_on: [linux-gtk, linux-qt, macos-gtk, macos-qt, windows-gtk, windows-qt, windows-xaml, harmony-arkui] }
  - tap: { id: speech-stop }
  # The engine's cancellation arrives through the completion and lands as "Stopped". Targets whose
  # arm reports no end (speech-dispatcher), or that have no arm, settle on their own answer.
  - assert_text: { id: speech-state, text: "Stopped", skip_on: [linux-gtk, linux-qt, macos-gtk, macos-qt, windows-gtk, windows-qt, windows-xaml, harmony-arkui] }
  - assert_text: { id: speech-text, text: "Day speaks through the bridge." }
