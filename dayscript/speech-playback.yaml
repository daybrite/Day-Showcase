name: speech-playback
description: >-
  Opt-in native speech playback and cancellation check. Requires an installed voice and a
  working audio output; hosted Windows CI runners cannot satisfy that prerequisite.
flow:
  - wait_for: { id: nav }
  - navigate: { route: speech }
  # Keep the utterance long enough to stop it before natural completion.
  - input: { id: speech_text, text: "Day speaks through the native speech engine. This longer sentence keeps the voice speaking while the test checks its state and then asks it to stop." }
  - tap: { id: speech_speak }
  - assert_text: { id: speech_state, key: speech_state_speaking }
  - tap: { id: speech_stop }
  - assert_text: { id: speech_state, key: speech_state_stopped }
