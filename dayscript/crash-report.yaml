name: crash-report
description: >
  Run on the launch AFTER crash.yaml: day-piece-crash-reporter reconciled the previous session into a report, so
  the Crash Reporting page shows it in the viewer and the consent banner offers to send it. Screenshot
  it, then clear it so subsequent runs start clean.
flow:
  - wait_for: { id: nav }
  - navigate: { route: crash }
  - assert_route: { route: crash }
  - assert_visible: { id: crash_report }
  - screenshot: crash-report
  - tap: { id: crash_clear }
  - assert_visible: { id: crash_empty }
