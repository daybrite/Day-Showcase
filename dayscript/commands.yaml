name: reusable-commands
description: Shared content buttons and toolbar commands stay in sync across rebuilds.
flow:
  - wait_for: { id: nav }
  - navigate: { route: menus }
  - scroll_to: { id: commands_demo }
  - assert_text: { id: commands_count, text: '0' }
  - tap: { id: command_add }
  - assert_text: { id: commands_count, text: '1' }
  - navigate: { route: toolbars }
  - toolbar: { item: tb_star, on: true, skip_on: [harmony-arkui] }
  - assert_text: { id: toolbar_star_state, key: toolbar_on, skip_on: [harmony-arkui] }
  # Repeating a desired state must not invoke the toggle command a second time.
  - toolbar: { item: tb_star, on: true, skip_on: [harmony-arkui] }
  - assert_text: { id: toolbar_star_state, key: toolbar_on, skip_on: [harmony-arkui] }
  - menu: { key: cmd_unstar, skip_on: [ios-uikit, android-material, harmony-arkui, web-dom] }
  - assert_text: { id: toolbar_star_state, key: toolbar_off, skip_on: [ios-uikit, android-material, harmony-arkui, web-dom] }
  - toolbar: { item: tb_star, on: false, skip_on: [harmony-arkui] }
  - assert_text: { id: toolbar_star_state, key: toolbar_off, skip_on: [harmony-arkui] }
  - navigate: { route: menus }
  - scroll_to: { id: commands_demo }
  - tap: { id: command_add }
  - toolbar: { item: command_add_toolbar, skip_on: [harmony-arkui] }
  - assert_text: { id: commands_count, text: '2', skip_on: [harmony-arkui] }
  - tap: { id: command_add }
  - assert_text: { id: commands_count, text: '3', skip_on: [harmony-arkui] }
  - screenshot: reusable-commands
  - toolbar: { item: command_reset_toolbar, skip_on: [harmony-arkui] }
  - tap: { id: command_reset, skip_on: [macos-appkit, macos-gtk, macos-qt, ios-uikit, android-material, web-dom] }
  - assert_text: { id: commands_count, text: '0' }
  - tap: { id: command_add }
  - tap: { id: command_reset }
  - assert_text: { id: commands_count, text: '0' }
  - navigate: { route: about }
  - navigate: { route: menus }
  - scroll_to: { id: commands_demo }
  - tap: { id: command_add }
  - assert_text: { id: commands_count, text: '1' }
