name: haptics-song
description: Play a haptic song and confirm the app reports it.
flow:
  - wait_for: { id: nav }
  - navigate: { route: speech }
  - wait_for: { id: haptics_supported }
  - scroll_to: { id: haptics_song_celebration }
  - tap: { id: haptics_song_celebration }
  - assert_text: { id: haptics_last_played, text: "Played: Celebration" }
  - screenshot: haptics-song-played
