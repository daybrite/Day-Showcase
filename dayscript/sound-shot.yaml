name: sound-shot
description: The Sound effects group — the clip grid, the panned clip, the volume slider, the readout after two plays, and the loop switched on.
flow:
  - wait_for: { id: nav }
  - navigate: { route: speech }
  - wait_for: { id: sound-click }
  - scroll_to: { id: sound-looping }
  - tap: { id: sound-card }
  - assert_text: { id: sound-last-played, key: sound_last_played, args: { clip: "sounds/card.wav" } }
  - tap: { id: sound-left }
  - assert_text: { id: sound-last-played, key: sound_last_played, args: { clip: "sounds/glass.wav" } }
  - toggle: { id: sound-loop, value: true }
  - assert_text: { id: sound-looping, key: sound_looping_clip, args: { clip: "sounds/hum.wav" } }
  - screenshot: sound-grid
  - toggle: { id: sound-loop, value: false }
  - assert_text: { id: sound-looping, key: sound_looping_none }
