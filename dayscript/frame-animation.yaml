name: frame-animation
description: Native frames animate 1–250 marbles under adjustable gravity, pause, resume, settle, and survive navigation.
flow:
  - wait_for: { id: nav }
  - navigate: { route: physics }
  # The page opens at zero-G; the timed settling below needs a pull to bring the marbles down.
  - assert_text: { id: physics_gravity_value, text: "0.00 m/s² (zero-G)" }
  - set_value: { id: physics_gravity_slider, value: 9.81 }
  - assert_visible: { id: frame_ball }
  - assert_text: { id: frame_status, text: Resting }
  - assert_text: { id: frame_fps, text: "FPS · min — · max — · avg —" }
  - assert_text: { id: frame_ball_count, text: '20' }
  - set_value: { id: frame_ball_slider, value: 250 }
  - assert_text: { id: frame_ball_count, text: '250' }
  - tap: { id: frame_bounce }
  - pause: { secs: 0.3 }
  # Running is set only by a delivered native frame, never by the button.
  - assert_text: { id: frame_status, text: Running }
  - tap: { id: frame_pause }
  - assert_text: { id: frame_status, text: Paused }
  - screenshot: marbles-paused
  - pause: { secs: 0.5 }
  - assert_text: { id: frame_status, text: Paused }
  - tap: { id: frame_pause }
  - pause: { secs: 0.2 }
  - assert_text: { id: frame_status, text: Running }
  # Settle a deterministic small load; 250 retained-mode marbles can run below real time.
  - set_value: { id: frame_ball_slider, value: 1 }
  - tap: { id: frame_reset }
  - tap: { id: frame_bounce }
  - assert_text: { id: frame_status, text: Resting, timeout_secs: 15 }
  - tap: { id: frame_ball }
  - pause: { secs: 0.2 }
  - assert_text: { id: frame_status, text: Running }
  # Gravity runs from zero-G to Jupiter, and the readout names the body a value matches.
  - set_value: { id: physics_gravity_slider, value: 0 }
  - assert_text: { id: physics_gravity_value, text: "0.00 m/s² (zero-G)" }
  - set_value: { id: physics_gravity_slider, value: 24.79 }
  - assert_text: { id: physics_gravity_value, text: "24.79 m/s² (Jupiter)" }
  - set_value: { id: physics_gravity_slider, value: 9.81 }
  - assert_text: { id: physics_gravity_value, text: "9.81 m/s² (Earth)" }
  # Ball mass: massless to start, up to half a megatonne.
  - assert_text: { id: physics_mass_value, text: "0.000 Mt" }
  - set_value: { id: physics_mass_slider, value: 0.25 }
  - assert_text: { id: physics_mass_value, text: "0.250 Mt" }
  - set_value: { id: physics_mass_slider, value: 0 }
  - assert_text: { id: physics_mass_value, text: "0.000 Mt" }
  # Shuffle sets every slider at random and throws the marbles toward a random point.
  - tap: { id: frame_reset }
  - assert_text: { id: frame_status, text: Resting }
  - tap: { id: physics_shuffle }
  - pause: { secs: 0.3 }
  - assert_text: { id: frame_status, text: Running }
  - screenshot: marbles-shuffled
  # Back to one slow, settling marble for what follows.
  - set_value: { id: physics_mass_slider, value: 0 }
  - set_value: { id: physics_gravity_slider, value: 9.81 }
  - set_value: { id: frame_ball_slider, value: 1 }
  - assert_text: { id: frame_ball_count, text: '1' }
  - tap: { id: frame_reset }
  - assert_text: { id: frame_status, text: Resting }
  - tap: { id: frame_bounce }
  - navigate: { route: about }
  - navigate: { route: physics }
  - tap: { id: frame_reset }
  - tap: { id: frame_bounce }
  - pause: { secs: 0.25 }
  - assert_text: { id: frame_status, text: Running }
  - tap: { id: frame_pause }
  - set_value: { id: frame_ball_slider, value: 125 }
  - assert_text: { id: frame_ball_count, text: '125' }
  - assert_text: { id: frame_fps, text: "FPS · min — · max — · avg —" }
  - assert_text: { id: frame_status, text: Paused }
  - tap: { id: frame_ball }
  - pause: { secs: 0.25 }
  - assert_text: { id: frame_status, text: Running }
  - tap: { id: frame_pause }
  - screenshot: marbles-bounce
  - tap: { id: frame_reset }
  - assert_text: { id: frame_fps, text: "FPS · min — · max — · avg —" }
