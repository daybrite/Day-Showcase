name: frame-animation
description: Native frames animate 1–250 marbles, pause, resume, settle, and survive navigation.
flow:
  - wait_for: { id: nav }
  - navigate: { route: animation }
  - scroll_to: { id: frame-demo }
  - assert_visible: { id: frame-ball }
  - assert_missing: { id: frame-readout }
  - assert_text: { id: frame-status, text: Resting }
  - assert_text: { id: frame-fps, text: "FPS · min — · max — · avg —" }
  - assert_text: { id: frame-ball-count, text: 'Balls: 1' }
  - set_value: { id: frame-ball-slider, value: 250 }
  - assert_text: { id: frame-ball-count, text: 'Balls: 250' }
  - tap: { id: frame-bounce }
  - pause: { secs: 0.3 }
  # Running is set only by a delivered native frame, never by the button.
  - assert_text: { id: frame-status, text: Running }
  - tap: { id: frame-pause }
  - assert_text: { id: frame-status, text: Paused }
  - screenshot: marbles-paused
  - pause: { secs: 0.5 }
  - assert_text: { id: frame-status, text: Paused }
  - tap: { id: frame-pause }
  - pause: { secs: 0.2 }
  - assert_text: { id: frame-status, text: Running }
  - pause: { secs: 5.0 }
  - assert_text: { id: frame-status, text: Resting }
  - tap: { id: frame-ball }
  - pause: { secs: 0.2 }
  - assert_text: { id: frame-status, text: Running }
  - set_value: { id: frame-ball-slider, value: 1 }
  - assert_text: { id: frame-ball-count, text: 'Balls: 1' }
  - tap: { id: frame-reset }
  - assert_text: { id: frame-status, text: Resting }
  - tap: { id: frame-bounce }
  - navigate: { route: about }
  - navigate: { route: animation }
  - scroll_to: { id: frame-demo }
  - tap: { id: frame-reset }
  - tap: { id: frame-bounce }
  - pause: { secs: 0.25 }
  - assert_text: { id: frame-status, text: Running }
  - tap: { id: frame-pause }
  - set_value: { id: frame-ball-slider, value: 125 }
  - assert_text: { id: frame-ball-count, text: 'Balls: 125' }
  - assert_text: { id: frame-fps, text: "FPS · min — · max — · avg —" }
  - assert_text: { id: frame-status, text: Paused }
  - tap: { id: frame-ball }
  - pause: { secs: 0.25 }
  - assert_text: { id: frame-status, text: Running }
  - tap: { id: frame-pause }
  - screenshot: marbles-bounce
  - tap: { id: frame-reset }
  - assert_text: { id: frame-fps, text: "FPS · min — · max — · avg —" }
