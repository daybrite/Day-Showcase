name: text
description: Navigate to the Text playground and screenshot the typography specimen.
flow:
  - wait_for: { id: nav }
  - navigate: { route: text }
  - assert_route: { route: text }
  - assert_visible: { id: text_emphasis }
  - assert_visible: { id: text_font_pacifico }
  - assert_visible: { id: text_font_bungee }
  - assert_visible: { id: text_font_specialelite }
  - screenshot: text
  - pause: 1
