name: query-worker
description: Worker-backed search, edits, FTS, viewport filtering and stable selection.
flow:
  - wait_for: { id: nav }
  - navigate: { route: query }
  - assert_route: { route: query }
  - assert_text: { id: query_caption, key: query_caption, args: { count: 10000, total: 10000 } }
  - toggle: { id: query_filter, value: true }
  - assert_text: { id: query_caption, key: query_caption, args: { count: 1428, total: 10000 } }
  - toggle: { id: query_filter, value: false }
  - input: { id: query_search, text: "0042" }
  - assert_text: { id: query_caption, key: query_caption, args: { count: 1, total: 10000 } }
  - select: { id: query_list, index: 0 }
  - assert_text: { id: query_selected, key: query_selected, args: { title: "Electric Harbor Light 0042" } }
  # Row identity across a filter flip: the same keyed row stays on screen, same selection.
  - toggle: { id: query_filter, value: true }
  - assert_text: { id: query_caption, key: query_caption, args: { count: 1, total: 10000 } }
  - assert_visible: { id: "query_row:42" }
  - assert_text: { id: query_selected, key: query_selected, args: { title: "Electric Harbor Light 0042" } }
  - toggle: { id: query_filter, value: false }
  - assert_visible: { id: "query_row:42" }
  - screenshot:
      name: query
      title: { en: "Query", fr: "Requête", ar: "الاستعلام", zh-CN: "查询" }
      caption: { en: "A live query over 10,000 rows.", fr: "Une requête en direct sur 10 000 lignes.", ar: "استعلام مباشر على 10000 صف.", zh-CN: "对一万行的实时查询。" }
      source: src/pages/query.rs
  # An edit that moves a row across the predicate, both directions, while the query watches.
  - input: { id: query_search, text: "0043" }
  # Async searches can have the same count as the previous result; wait for identity.
  - wait_for: { id: "query_row:43" }
  - assert_text: { id: query_caption, key: query_caption, args: { count: 1, total: 10000 } }
  - select: { id: query_list, index: 0 }
  - tap: { id: query_star }
  - toggle: { id: query_filter, value: true }
  # wait_for, not assert_visible: the reload realizes cells on the host's next layout pass
  # (Android defers notifyDataSetChanged), so the row's keyed id lands a beat later.
  - wait_for: { id: "query_row:43" }
  - assert_text: { id: query_caption, key: query_caption, args: { count: 1, total: 10000 } }
  - tap: { id: query_star }
  - assert_text: { id: query_caption, key: query_caption, args: { count: 0, total: 10000 } }
  - toggle: { id: query_filter, value: false }
  - input: { id: query_search, text: "" }
  - assert_text: { id: query_caption, key: query_caption, args: { count: 10000, total: 10000 } }
  - assert_visible: { id: query_evals, skip_on: [dom] }
  # FTS5 through the generated shadow index (native only; web has no SQLite). The same term
  # answers identically through substring and MATCH; FTS-only syntax then narrows further.
  # 1250 = every eighth title is "Electric …"; 313 of those also carry a Harbor token.
  - input: { id: query_search, text: "electric", skip_on: [dom] }
  - assert_text: { id: query_caption, key: query_caption, args: { count: 1250, total: 10000 }, skip_on: [dom] }
  - toggle: { id: query_fts, value: true, skip_on: [dom] }
  - assert_text: { id: query_caption, key: query_caption, args: { count: 1250, total: 10000 }, skip_on: [dom] }
  - input: { id: query_search, text: "electric AND harbor", skip_on: [dom] }
  - assert_text: { id: query_caption, key: query_caption, args: { count: 313, total: 10000 }, skip_on: [dom] }
  - toggle: { id: query_fts, value: false, skip_on: [dom] }
  - input: { id: query_search, text: "", skip_on: [dom] }
  # The R*Tree viewport: a 16-degree latitude band of the deterministic pin grid holds 1600
  # pins; starred-only narrows it to 229.
  - toggle: { id: query_viewport, value: true, skip_on: [dom] }
  - set_value: { id: query_lat, value: 20, skip_on: [dom] }
  - assert_text: { id: query_caption, key: query_caption, args: { count: 1600, total: 10000 }, skip_on: [dom] }
  - toggle: { id: query_filter, value: true, skip_on: [dom] }
  - assert_text: { id: query_caption, key: query_caption, args: { count: 229, total: 10000 }, skip_on: [dom] }
  - toggle: { id: query_filter, value: false, skip_on: [dom] }
  - toggle: { id: query_viewport, value: false, skip_on: [dom] }
  - assert_text: { id: query_caption, key: query_caption, args: { count: 10000, total: 10000 } }

