name: haptics-lock
description: Every haptic control greys out while a song plays, and comes back when it ends.
flow:
  - wait_for: { id: nav }
  - navigate: { route: speech }
  - wait_for: { id: haptics_supported }
  - scroll_to: { id: haptics_song_cascade }
  - tap: { id: haptics_song_celebration }
  - screenshot: haptics-locked
  # A tap on a disabled button must not register: the status must still name the song.
  - tap: { id: haptics_heavy }
  - assert_text: { id: haptics_last_played, text: "Played: Celebration" }
  # Celebration is 5.6 s; wait it out and confirm the controls return.
  - pause: 7
  - screenshot: haptics-unlocked
  - tap: { id: haptics_heavy }
  - assert_text: { id: haptics_last_played, text: "Played: Heavy" }
