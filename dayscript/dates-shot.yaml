name: dates-shot
description: Open the Date & time page and screenshot it in its seeded state — the visual check
  for the native date/time picker realizations (docs/datepicker.md).
flow:
  - wait_for: { id: nav }
  - navigate: { route: dates }
  - assert_route: { route: dates }
  - assert_visible: { id: date_compact }
  - assert_visible: { id: date_inline }
  - assert_visible: { id: time_compact }
  - assert_visible: { id: time_seconds }
  - assert_visible: { id: date_bounded }
  - screenshot: dates
