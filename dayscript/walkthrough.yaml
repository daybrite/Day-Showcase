name: showcase-walkthrough
description: Navigate every destination, exercise every control, take localized screenshots
  (DESIGN.md §14.1, docs/navigation.md). Top-level nav is a selector(Sidebar); tabs a
  selector(Tabs); the stack section is a genuine push/pop stack bound to a path signal. Every
  page is a grouped form (docs/forms.md) of themed sections — menus & dialogs share one page.
flow:
  - wait_for: { id: nav }
  - screenshot:
      name: home
      title: { en: "Home", fr: "Accueil", ar: "الرئيسية", zh-CN: "主页" }
      caption: { en: "The app's sidebar of demo pages.", fr: "La barre latérale des pages de démonstration.", ar: "الشريط الجانبي لصفحات العرض التوضيحي.", zh-CN: "演示页面的侧边栏。" }
      source: src/lib.rs

  # Leaving via a route the stack doesn't own falls through to the enclosing selector.
  - navigate: { route: about }
  - assert_route: { route: about }
  - assert_visible: { id: about-text }
  - assert_visible: { id: about-version }
  - assert_visible: { id: about-toolkit }
  - assert_visible: { id: about-lifecycle }
  - screenshot:
      name: about
      title: { en: "About", fr: "À propos", ar: "حول", zh-CN: "关于" }
      source: src/pages/about.rs
  - nav_back:
  - assert_route: { route: "" }
  - screenshot: back-home

  # Declarative animation (§8.4, docs/animation.md): queue DETERMINISTIC targets (fixed values,
  # not Randomize! — screenshots must reproduce), commit them inside one with_animation via
  # Animate!, and let the backend interpolation settle before capturing.
  - navigate: { route: animation }
  - assert_route: { route: animation }
  - assert_visible: { id: animation-title }
  - set_value: { id: anim-scale, value: 1.25 }
  - set_value: { id: anim-rotation, value: 30 }
  - set_value: { id: anim-hue, value: 200 }
  - tap: { id: anim-go }
  - pause: { secs: 1.0 }
  - screenshot:
      name: animation
      title: { en: "Animation", fr: "Animation", ar: "الرسوم المتحركة", zh-CN: "动画" }
      source: src/pages/animation.rs

  # Benchmark (the Day-Bench Grids benchmark): a deterministic patchwork — the same (seed, count)
  # draws the same picture on every target, so the shots are diffable. The readouts prove the
  # sliders reached the generator; the row counts are pinned by unit tests
  # (known_parameters_pack_to_known_row_counts), so a generator change fails in cargo test first.
  - navigate: { route: benchmark }
  - assert_route: { route: benchmark }
  - assert_visible: { id: benchmark-title }
  - wait_for: { id: bench-grid }
  - assert_text: { id: bench-seed-value, text: "1" }
  - assert_text: { id: bench-count-value, text: "48" }
  - assert_text: { id: bench-rows, key: bench_rows, args: { rows: 10 } }
  - screenshot:
      name: benchmark
      title: { en: "Benchmark", fr: "Benchmark", ar: "قياس الأداء", zh-CN: "基准测试" }
      source: src/pages/benchmark.rs
  # Denser patchwork, then back to the defaults — reproducibility means the run must land on the
  # row count it opened with.
  - set_value: { id: bench-count, value: 240 }
  - assert_text: { id: bench-count-value, text: "240" }
  - assert_text: { id: bench-rows, key: bench_rows, args: { rows: 45 } }
  - screenshot: benchmark-dense
  - set_value: { id: bench-count, value: 48 }
  - assert_text: { id: bench-rows, key: bench_rows, args: { rows: 10 } }
  # The SwiftUI twin (day-piece-swiftui, docs/swiftui.md) — the segmented picker exists only where
  # support() is Native, so these steps are gated to the two Apple-native targets. The pane's own
  # sliders live inside the hosted SwiftUI view (no dayscript ids); the shot is the deliverable.
  - select: { id: bench-impl, index: 1, only_on: [macos-appkit, ios-uikit] }
  - wait_for: { id: bench-swiftui, only_on: [macos-appkit, ios-uikit] }
  - pause: { secs: 1.0, only_on: [macos-appkit, ios-uikit] }
  - screenshot: { name: benchmark-swiftui, only_on: [macos-appkit, ios-uikit] }
  - select: { id: bench-impl, index: 0, only_on: [macos-appkit, ios-uikit] }

  # Canvas & shapes: the 3×3 shape-kind grid (one slider rotates every shape live), the
  # gradient grid, the slider-driven gauge, and the composition-tier widgets. Drive the shared
  # rotation so the screenshot shows the grid mid-spin.
  - navigate: { route: canvas }
  - assert_route: { route: canvas }
  - assert_visible: { id: canvas-title }
  - set_value: { id: shapes-angle-slider, value: 45 }
  # Accessibility (§13): diff the native AX tree against day's expectations. The gauge is a
  # canvas, so day applies role=Meter + a spoken label/value; the audit reads them back natively
  # (apple targets; gtk/qt report unsupported and skip). A full-tree audit follows.
  - assert_visible: { id: gauge }
  - a11y_audit: { id: gauge }
  - a11y_audit: {}
  # Compose section: tap the 4th star (each star is `compose-rating:N`) and assert the bound
  # text field re-rendered with the count.
  - tap: { id: "compose-rating:4" }
  - assert_text: { id: compose-rating-value, text: "4" }
  - screenshot:
      name: canvas
      title: { en: "Canvas & shapes", fr: "Canevas et formes", ar: "اللوحة والأشكال", zh-CN: "画布与形状" }
      source: src/pages/canvas.rs

  # Controls (docs/forms.md): every interactive control in one grouped form — basics, the three
  # picker stylings, search, and progress/activity feedback.
  - navigate: { route: controls }
  - assert_route: { route: controls }
  - assert_visible: { id: controls-title }
  # The page is one small mixer: a name, a level, a preset, and a master switch, with every
  # control bound to that shared state. So each step below drives ONE control and asserts that a
  # DIFFERENT one moved — which is the property the page exists to demonstrate.
  - input: { id: name-field, text: "Ada" }
  # Slider → numeric readout AND the progress bar AND the preset label. 80 sits on no preset, so
  # the label reads "Custom": the derivation from level back to preset terms.
  - set_value: { id: volume-slider, value: 80 }
  - assert_text: { id: volume-value, text: "80" }
  - assert_value: { id: volume-progress, value: 0.8 }
  - assert_text: { id: picker-value, key: mix_custom }
  # The steppers write the same signal the slider does, ±5 a press.
  - tap: { id: increment-button, repeat: 2 }
  - assert_text: { id: volume-value, text: "90" }
  # 90 IS the Large preset, so the label snaps back out of "Custom" on its own.
  - assert_text: { id: picker-value, key: size_large }
  - tap: { id: decrement-button }
  - assert_text: { id: volume-value, text: "85" }
  # Three native picker stylings over ONE Signal<usize>: selecting in any one moves the other two,
  # and the watch in Mix::new snaps the level, which the readout and progress bar report.
  - select: { id: picker-segmented, index: 0 }
  - assert_text: { id: picker-value, key: size_small }
  - assert_text: { id: volume-value, text: "25" }
  - assert_value: { id: volume-progress, value: 0.25 }
  - select: { id: picker-menu, index: 2 }
  - assert_text: { id: volume-value, text: "90" }
  - select: { id: picker-inline, index: 1 }
  - assert_text: { id: picker-value, key: size_medium }
  - assert_text: { id: volume-value, text: "60" }
  # The master switch dims the editors and stops the activity indicator.
  - toggle: { id: subscribe-toggle, value: false }
  - assert_text: { id: activity-status, key: activity_off }
  - toggle: { id: subscribe-toggle, value: true }
  - assert_text: { id: activity-status, key: activity_on }
  # Combo box (day-piece-combobox, docs/combobox.md): menu selection and free-form entry over the
  # same list. `select` is the menu path (options are localized, so assert by key); `input` is the
  # free-form path (a literal — user input is not localized); Add grows the list for both.
  - select: { id: flavor-combo, index: 2 }
  - assert_text: { id: flavor-value, key: pistachio }
  - input: { id: flavor-combo, text: "Stracciatella" }
  - assert_text: { id: flavor-value, text: "Stracciatella" }
  - tap: { id: flavor-add }
  - select: { id: flavor-combo, index: 3 }
  - assert_text: { id: flavor-value, text: "Stracciatella" }
  # The search field filters the SAME collection the combo offers, so the two share state too.
  - input: { id: search-input, key: chocolate }
  - assert_text: { id: search-result, key: chocolate }
  - tap: { id: search-clear }
  - assert_text: { id: search-result, key: vanilla }
  - screenshot:
      name: controls
      title: { en: "Controls", fr: "Contrôles", ar: "عناصر التحكّم", zh-CN: "控件" }
      source: src/pages/controls.rs

  # Crash Reporting (day-break, docs/break.md): the walkthrough only VISITS the page (empty state);
  # the actual crash + next-launch report are driven by crash.yaml / crash-report.yaml so the
  # walkthrough itself never dies mid-run.
  - navigate: { route: crash }
  - assert_route: { route: crash }
  - assert_visible: { id: crash-title }
  - assert_visible: { id: crash-abort }
  - screenshot:
      name: crash
      title: { en: "Crash reporting", fr: "Rapports de plantage", ar: "الإبلاغ عن الأعطال", zh-CN: "崩溃报告" }
      source: src/pages/crash.rs

  # Date & time (docs/datepicker.md): native pickers bound two-way to civil date/time signals.
  # Every picker accepts a synthetic ISO `input:` on every backend, and the readouts are
  # locale-independent ISO from the bound signals — the same steps assert the two-way binding
  # under NSDatePicker, UIDatePicker, Material dialogs, QDateEdit, and the composed GTK build.
  - navigate: { route: dates }
  - assert_route: { route: dates }
  - assert_visible: { id: dates-title }
  - input: { id: date-compact, text: "2026-11-05" }
  - assert_text: { id: date-value, text: "2026-11-05" }
  # The inline calendar is bound to the SAME date signal — driving it moves the same readout.
  - input: { id: date-inline, text: "2026-03-09" }
  - assert_text: { id: date-value, text: "2026-03-09" }
  # Both time pickers share one signal; the seconds variant mirrors the compact one.
  - input: { id: time-compact, text: "14:45" }
  - assert_text: { id: time-value, text: "14:45" }
  - input: { id: time-seconds, text: "14:45:30" }
  - assert_text: { id: time-value, text: "14:45:30" }
  # The bounded picker clamps every pick into 2026 (min/max, docs/datepicker.md).
  - input: { id: date-bounded, text: "2027-06-15" }
  - assert_text: { id: date-bounded-value, text: "2026-12-31" }
  - screenshot:
      name: dates
      title: { en: "Date & time", fr: "Date et heure", ar: "التاريخ والوقت", zh-CN: "日期与时间" }
      source: src/pages/dates.rs

  # Device & sensors: the headless device-state parts in one form. The battery preview slider +
  # charging toggle drive a deterministic state (65% + bolt) for the screenshot, then a low
  # level checks the readout; sensors need a second poll after the first read arms the listener
  # (push-model platforms); CI hosts are online; device identity varies, so presence only.
  - navigate: { route: system }
  - assert_route: { route: system }
  - assert_visible: { id: battery }
  - a11y_audit: { id: battery }
  - set_value: { id: battery-level, value: 65 }
  - toggle: { id: battery-charging, value: true }
  - tap: { id: network-refresh }
  # Sensors stream now (docs/sensors.md), so there is nothing to refresh: each row subscribes on
  # page build and updates itself. Assert the rows are present — their VALUES are live and differ
  # per device, so they are never asserted.
  - assert_visible: { id: sensor-accel }
  - assert_visible: { id: sensor-gyro }
  - assert_visible: { id: sensor-magnet }
  # Permission rows (docs/permissions.md) show STATUS only. Their Request buttons are deliberately
  # never tapped here: an OS permission dialog is a system modal that dayscript cannot dismiss (it
  # is not on day's present() rail), so a tap would hang the run on the Simulator and the emulator.
  # apps/showcase/dayscript/permissions-request.yaml drives the real prompt, opt-in.
  - assert_visible: { id: sensors-perm }
  - assert_visible: { id: location-perm }
  - assert_visible: { id: location-coords }
  - assert_visible: { id: deviceinfo-model }
  - tap: { id: deviceinfo-refresh }
  - assert_visible: { id: deviceinfo-system }
  - screenshot:
      name: system
      title: { en: "Device & sensors", fr: "Appareil et capteurs", ar: "الجهاز والمستشعرات", zh-CN: "设备与传感器" }
      source: src/pages/system.rs
  - set_value: { id: battery-level, value: 12 }
  - assert_text: { id: battery-level-value, text: "12%" }
  - set_value: { id: battery-level, value: 65 }

  # Focus (docs/focus.md): `focus`/`assert_focused` drive the REAL toolkit duty, so the native
  # focus ring, the signal, and the probe must agree. Assertions stay on text fields — the one
  # control focusable on every platform.
  - navigate: { route: focus }
  - assert_route: { route: focus }
  - assert_visible: { id: focus-title }
  # Programmatic request through the group signal: the "next" button starts the cycle at Name.
  - tap: { id: focus-next-button }
  - assert_focused: { id: focus-name-field }
  - assert_text: { id: focus-current, key: focus_name_label }
  # Script-driven duty: land focus directly on the email field. The readout following proves the
  # loss/gain pair moved the group signal without blipping through None.
  - focus: { id: focus-email-field }
  - assert_focused: { id: focus-email-field }
  - assert_focused: { id: focus-name-field, focused: false }
  - assert_text: { id: focus-current, key: focus_email_label }
  # Clear resigns: nobody holds focus and the readout empties.
  - tap: { id: focus-clear-button }
  - assert_focused: { id: focus-email-field, focused: false }
  - assert_text: { id: focus-current, text: "—" }
  # Bool binding: buttons write the signal; the readout mirrors what the toolkit reports back.
  - tap: { id: focus-bool-focus }
  - assert_focused: { id: focus-bool-field }
  - assert_text: { id: focus-bool-state, key: focus_state_on }
  - tap: { id: focus-bool-blur }
  - assert_focused: { id: focus-bool-field, focused: false }
  - assert_text: { id: focus-bool-state, key: focus_state_off }
  - screenshot:
      name: focus
      title: { en: "Focus", fr: "Focus", ar: "التركيز", zh-CN: "焦点" }
      source: src/pages/focus.rs

  # Grid (docs/grid.md): columns sized by content, spans, and flexible cells. Desktop hosts the
  # sub-pages as tabs (basics preselected), mobile as a menu of pushed pages — so this stop only
  # takes the section screenshot; grid behavior itself is pinned by the day-pieces grid tests.
  - navigate: { route: grid }
  - screenshot:
      name: grid
      title: { en: "Grid", fr: "Grille", ar: "الشبكة", zh-CN: "网格" }
      source: src/pages/grid.rs

  # Row fit policies (docs/size-classes.md "Row fit policies"): ONE row of numbered buttons
  # rebuilt under whichever policy the picker selects, with a stepper for the count. Drive
  # every policy so each arm realizes on every backend — the arms are `when`-gated rebuilds,
  # which is exactly the seam a build-time property needs — then screenshot the Wrap arm with
  # the count raised, the state where the policies visibly differ.
  - navigate: { route: layout }
  - assert_route: { route: layout }
  - assert_visible: { id: layout-title }
  - assert_text: { id: layout-count, text: "5" }
  - assert_visible: { id: layout-demo }
  - tap: { id: layout-add, repeat: 3 }
  - assert_text: { id: layout-count, text: "8" }
  - select: { id: layout-fit, index: 1 }
  - assert_visible: { id: layout-demo }
  - screenshot:
      name: layout
      title: { en: "Layout", fr: "Disposition", ar: "التخطيط", zh-CN: "布局" }
      caption: { en: "One row under each fit policy.", fr: "Une même rangée selon chaque politique d'ajustement.", ar: "صف واحد وفق كل سياسة ملاءمة.", zh-CN: "同一行在各种适配策略下的表现。" }
      source: src/pages/layout.rs
  # The same eight buttons one policy over: Wrap's ragged lines become aligned columns. The
  # pair is the comparison, so both halves are captured.
  - select: { id: layout-fit, index: 2 }
  - assert_visible: { id: layout-demo }
  - screenshot: layout-even-columns
  - select: { id: layout-fit, index: 3 }
  - assert_visible: { id: layout-demo }
  - select: { id: layout-fit, index: 4 }
  - assert_visible: { id: layout-demo }
  # Back to the defaults, so the page reads pristine if a later variant revisits it.
  - select: { id: layout-fit, index: 0 }
  - assert_visible: { id: layout-demo }
  - tap: { id: layout-remove, repeat: 3 }
  - assert_text: { id: layout-count, text: "5" }

  # Native recycling list (docs/list.md): 500 virtualized rows — visited after the delicate
  # stack/tabs route assertions so they stay undisturbed. The list is wrapped in pull-to-refresh
  # (day-piece-pullrefresh): a synthetic toggle begins a reload that adds 100 rows and ends itself.
  - navigate: { route: list }
  - assert_route: { route: list }
  - assert_visible: { id: list-title }
  # Selection (docs/list.md): the synthetic select drives the same rail as a native tap;
  # the app signal echoes it back into the native list, so the screenshot shows the
  # highlighted row. Row index 1 = row number 2. Clear syncs an empty selection natively.
  - assert_text: { id: list-selection, key: list_selection_none }
  - select: { id: demo-list, index: 1 }
  - assert_text: { id: list-selection, key: list_selection, args: { count: 1, rows: "2" } }
  - screenshot:
      name: list
      title: { en: "List", fr: "Liste", ar: "القائمة", zh-CN: "列表" }
      source: src/pages/list.rs
  - tap: { id: list-clear }
  - assert_text: { id: list-selection, key: list_selection_none }
  - assert_text: { id: list-caption, key: list_caption, args: { count: 500 } }
  - toggle: { id: list-refresh, value: true }
  - pause: 2
  - assert_text: { id: list-caption, key: list_caption, args: { count: 600 } }
  # Drag-to-reorder (docs/list.md): the `reorder` step drives the same guard → commit path a
  # native drag takes. The order readout shows the first five row numbers. Row 2 (index 1) drops
  # at index 4; then a drop AIMED at the pinned first slot lands at index 1 instead — the
  # guard's Retarget verdict, observable in the readout (index 0 never changes).
  - assert_text: { id: list-order, key: list_order, args: { rows: "1,2,3,4,5" } }
  - reorder: { id: demo-list, from: 1, to: 4 }
  - assert_text: { id: list-order, key: list_order, args: { rows: "1,3,4,5,2" } }
  - reorder: { id: demo-list, from: 2, to: 0 }
  - assert_text: { id: list-order, key: list_order, args: { rows: "1,4,3,5,2" } }
  # Programmatic scrolling, merged from the old Scrolling page: the buttons drive the
  # RECYCLING list (scroll-to-row realizes virtualized rows; row 100 is highlighted so the
  # jump visibly lands). Then Shuffle randomizes the order — animated as native row moves
  # where the toolkit supports it — and Reset restores it, undoing the reorders above too.
  - tap: { id: list-scroll-bottom }
  - wait_idle:
  - pause: { secs: 0.7 }
  - screenshot: list-bottom
  - tap: { id: list-scroll-item }
  - wait_idle:
  - pause: { secs: 0.7 }
  # The jump targets the ROW, not the position: it selects row 100, and the selection readout
  # names it whatever index the row currently sits at.
  - assert_text: { id: list-selection, key: list_selection, args: { count: 1, rows: "100" } }
  - screenshot:
      name: list-item-100
      title: { en: "List · programmatic scrolling", fr: "Liste · défilement programmatique", ar: "القائمة · تمرير برمجي", zh-CN: "列表 · 程序化滚动" }
      source: src/pages/list.rs
  - tap: { id: list-scroll-top }
  - wait_idle:
  # Shuffle moves row 100 somewhere else, then jump again: the same assertion has to hold, which
  # it would not for a hardcoded index 99.
  - tap: { id: list-shuffle }
  - pause: { secs: 0.7 }
  - tap: { id: list-clear }
  - assert_text: { id: list-selection, key: list_selection_none }
  - tap: { id: list-scroll-item }
  - wait_idle:
  - pause: { secs: 0.7 }
  - assert_text: { id: list-selection, key: list_selection, args: { count: 1, rows: "100" } }
  - screenshot: list-item-100-shuffled
  - tap: { id: list-reset }
  - assert_text: { id: list-order, key: list_order, args: { rows: "1,2,3,4,5" } }

  # Swipe-to-delete (docs/list.md). The `delete_row` step drives the guard → commit seam, not a
  # platform gesture, so this asserts on EVERY target — including the desktops, whose toolkits
  # answer Cap::ListDelete = Unsupported and have no swipe to simulate.
  - delete_row: { id: demo-list, row: 1 }
  - assert_text: { id: list-order, key: list_order, args: { rows: "1,3,4,5,6" } }
  - delete_row: { id: demo-list, row: 1 }
  - assert_text: { id: list-order, key: list_order, args: { rows: "1,4,5,6,7" } }
  - screenshot: list-deleted
  # (The pinned first row is protected by `delete_guard` too, but dayscript has no
  # assert-this-step-fails form, so that refusal is covered by day-pieces' mock tests instead.)
  # Reset restores the deleted rows, not just the order.
  - tap: { id: list-reset }
  - assert_text: { id: list-order, key: list_order, args: { rows: "1,2,3,4,5" } }

  # The tree piece (docs/tree.md): native on macOS/iOS/GTK, composed from day pieces on the
  # other targets — one script either way, because `expand:`/`tree_move:` drive the same
  # guard → commit seam a pointer does. A real drag and the per-row context menus are native
  # gestures, verified by hand per docs/tree.md; dayscript also has no assert-this-step-fails
  # form, so the Lock toggle's DENY verdict is exercised by pointer, not here.
  - navigate: { route: tree }
  - assert_route: { route: tree }
  - assert_visible: { id: tree-title }
  # Initial disclosure: src open, pages and docs closed — both directions one step away.
  - wait_for: { id: tree-node-1 }
  - wait_for: { id: tree-node-2 }
  - assert_missing: { id: tree-node-5 }
  - assert_text: { id: tree-count, key: tree_count, args: { count: 9 } }
  - expand: { id: demo-tree, row: tree-node-4 }
  - wait_for: { id: tree-node-5 }
  # Cargo.toml re-files into src at position 0; the readout echoes the committed move.
  - tree_move: { id: demo-tree, row: tree-node-9, parent: tree-node-1, index: 0 }
  - assert_text: { id: tree-last-move, key: tree_move, args: { index: 0, name: "Cargo.toml", parent: "src" } }
  - tap: { id: tree-expand-all }
  - wait_for: { id: tree-node-8 }
  - pause: { secs: 0.7 }
  - screenshot:
      name: tree
      title: { en: "Tree", fr: "Arborescence", ar: "شجرة", zh-CN: "树" }
      source: src/pages/tree.rs

  # Localization (docs/localization.md): live locale switching, icu4x NUMBER/DATETIME rendering,
  # CLDR plural categories, and collation-aware sorting. Key-based asserts resolve through the
  # SAME bundle + formatter as the labels, so the expected strings are locale-correct by
  # construction (ar gets zero/two/few/many plurals and Arabic date patterns, fr narrow-NBSP
  # grouping, zh CLDR date patterns).
  # The observable model (docs/model.md): a Store<Keyed<Task>> drives the recycling list
  # directly. The editor and the mirror label bind the SELECTED row's fields through the store,
  # so asserting the mirror after typing proves the round trip without reaching into a recycled
  # cell; hiding done rows re-runs only the key projection.
  - navigate: { route: model }
  - assert_route: { route: model }
  - assert_visible: { id: model-title }
  - assert_text: { id: model-caption, key: model_caption, args: { count: 300 } }
  - assert_text: { id: model-selected, key: model_selected_none }
  - select: { id: model-list, index: 0 }
  - assert_text: { id: model-selected, key: model_selected, args: { title: "Task 1" } }
  - input: { id: model-name, text: "Renamed task" }
  - assert_text: { id: model-selected, key: model_selected, args: { title: "Renamed task" } }
  - screenshot:
      name: model
      title: { en: "Model", fr: "Modèle", ar: "النموذج", zh-CN: "模型" }
      source: src/pages/model.rs
  # Filtering: 75 of the 300 seeds are done (every fourth); hiding them changes the projection.
  - toggle: { id: model-filter, value: true }
  - assert_text: { id: model-caption, key: model_caption, args: { count: 225 } }
  # Marking the selected task done removes it from the filtered projection too.
  - toggle: { id: model-done, value: true }
  - assert_text: { id: model-caption, key: model_caption, args: { count: 224 } }
  - toggle: { id: model-filter, value: false }
  - assert_text: { id: model-caption, key: model_caption, args: { count: 300 } }
  # Persistence (docs/persistence.md): the store above is loaded from a ModelContainer on every
  # native target — the readout names the SQLite file — and insert/edit/delete below fold to one
  # INSERT, one UPDATE and one DELETE through the change log. The web build stays in memory, so
  # the file-name assert skips dom.
  - assert_visible: { id: model-storage }
  - assert_text: { id: model-storage, key: model_storage_file, args: { file: "showcase-model.db" }, skip_on: [dom] }
  - tap: { id: model-add }
  - assert_text: { id: model-caption, key: model_caption, args: { count: 301 } }
  - assert_text: { id: model-selected, key: model_selected, args: { title: "Task 301" } }
  - input: { id: model-name, text: "Persisted row" }
  - assert_text: { id: model-selected, key: model_selected, args: { title: "Persisted row" } }
  - tap: { id: model-delete }
  - assert_text: { id: model-caption, key: model_caption, args: { count: 300 } }
  - assert_text: { id: model-selected, key: model_selected_none }
  # Undo (docs/model.md): the change log read backward. The deleted row comes back WHOLE —
  # data included — as one unit; redo re-deletes it. The label readout carries the same string
  # the native Edit menu title interpolates ("remove" resolved to "Remove").
  - assert_text: { id: model-undo-label, text: "Remove" }
  - tap: { id: model-undo }
  - assert_text: { id: model-caption, key: model_caption, args: { count: 301 } }
  - tap: { id: model-redo }
  - assert_text: { id: model-caption, key: model_caption, args: { count: 300 } }
  # The redone unit is back on top of the undo stack — same label, ready to undo again.
  - assert_text: { id: model-undo-label, text: "Remove" }

  # Live queries (docs/persistence.md): 10,000 rows behind a typed query kept current
  # incrementally. Counts are arithmetic from the deterministic seed: "0042" appears in
  # exactly one title, every seventh row is starred (1428 of 10000), and id 42 is one of them.
  - navigate: { route: query }
  - assert_route: { route: query }
  - assert_visible: { id: query-title }
  - assert_text: { id: query-caption, key: query_caption, args: { count: 10000, total: 10000 } }
  - toggle: { id: query-filter, value: true }
  - assert_text: { id: query-caption, key: query_caption, args: { count: 1428, total: 10000 } }
  - toggle: { id: query-filter, value: false }
  - input: { id: query-search, text: "0042" }
  - assert_text: { id: query-caption, key: query_caption, args: { count: 1, total: 10000 } }
  - select: { id: query-list, index: 0 }
  - assert_text: { id: query-selected, key: query_selected, args: { title: "Electric Harbor Light 0042" } }
  # Row identity across a filter flip: the SAME keyed row stays on screen, same selection.
  - toggle: { id: query-filter, value: true }
  - assert_text: { id: query-caption, key: query_caption, args: { count: 1, total: 10000 } }
  - assert_visible: { id: "query-row:42" }
  - assert_text: { id: query-selected, key: query_selected, args: { title: "Electric Harbor Light 0042" } }
  - toggle: { id: query-filter, value: false }
  - assert_visible: { id: "query-row:42" }
  - screenshot:
      name: query
      title: { en: "Query", fr: "Requête", ar: "الاستعلام", zh-CN: "查询" }
      caption: { en: "A live query over 10,000 rows.", fr: "Une requête en direct sur 10 000 lignes.", ar: "استعلام مباشر على 10000 صف.", zh-CN: "对一万行的实时查询。" }
      source: src/pages/query.rs
  # An edit that moves a row ACROSS the predicate, both directions, while the query watches.
  - input: { id: query-search, text: "0043" }
  - assert_text: { id: query-caption, key: query_caption, args: { count: 1, total: 10000 } }
  - select: { id: query-list, index: 0 }
  - tap: { id: query-star }
  - toggle: { id: query-filter, value: true }
  # wait_for, not assert_visible: the reload realizes cells on the host's next layout pass
  # (Android defers notifyDataSetChanged), so the row's keyed id lands a beat later.
  - wait_for: { id: "query-row:43" }
  - assert_text: { id: query-caption, key: query_caption, args: { count: 1, total: 10000 } }
  - tap: { id: query-star }
  - assert_text: { id: query-caption, key: query_caption, args: { count: 0, total: 10000 } }
  - toggle: { id: query-filter, value: false }
  - input: { id: query-search, text: "" }
  - assert_text: { id: query-caption, key: query_caption, args: { count: 10000, total: 10000 } }
  - assert_visible: { id: query-evals, skip_on: [dom] }
  # FTS5 through the generated shadow index (native only — web has no SQLite). The same term
  # answers identically through substring and MATCH; FTS-only syntax then narrows further.
  # 1250 = every eighth title is "Electric …"; 313 of those also carry a Harbor token.
  - input: { id: query-search, text: "electric", skip_on: [dom] }
  - assert_text: { id: query-caption, key: query_caption, args: { count: 1250, total: 10000 }, skip_on: [dom] }
  - toggle: { id: query-fts, value: true, skip_on: [dom] }
  - assert_text: { id: query-caption, key: query_caption, args: { count: 1250, total: 10000 }, skip_on: [dom] }
  - input: { id: query-search, text: "electric AND harbor", skip_on: [dom] }
  - assert_text: { id: query-caption, key: query_caption, args: { count: 313, total: 10000 }, skip_on: [dom] }
  - toggle: { id: query-fts, value: false, skip_on: [dom] }
  - input: { id: query-search, text: "", skip_on: [dom] }
  # The R*Tree viewport: a 16-degree latitude band of the deterministic pin grid holds 1600
  # pins; starred-only narrows it to 229.
  - toggle: { id: query-viewport, value: true, skip_on: [dom] }
  - set_value: { id: query-lat, value: 20, skip_on: [dom] }
  - assert_text: { id: query-caption, key: query_caption, args: { count: 1600, total: 10000 }, skip_on: [dom] }
  - toggle: { id: query-filter, value: true, skip_on: [dom] }
  - assert_text: { id: query-caption, key: query_caption, args: { count: 229, total: 10000 }, skip_on: [dom] }
  - toggle: { id: query-filter, value: false, skip_on: [dom] }
  - toggle: { id: query-viewport, value: false, skip_on: [dom] }
  - assert_text: { id: query-caption, key: query_caption, args: { count: 10000, total: 10000 } }

  - navigate: { route: localization }
