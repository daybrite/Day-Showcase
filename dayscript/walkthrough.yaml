  # Preferences (docs/windows.md): the registered Settings…/⌘, action opens the singleton
  # preferences window — a real OS window on desktop, a fullscreen cover where the backend
  # has no secondary windows; the SAME ids resolve either way. The language picker is
  # universal; the theme picker is Cap::Appearance-gated and asserted in the desktop
  # windows script instead. Close runs the async confirm → teardown path.
  - menu: { key: day-preferences }
  - wait_for: { id: prefs-title }
  - assert_visible: { id: language-picker }
  - screenshot:
      name: preferences
      window: day.preferences
      title: { en: "Menus & dialogs · preferences window", fr: "Menus et dialogues · fenêtre des préférences", ar: "القوائم والحوارات · نافذة التفضيلات", zh-CN: "菜单与对话框 · 偏好设置窗口" }
      source: src/pages/preferences.rs
  - close_window: { window: day.preferences }

  # Platform services: an HTTP fetch (first — it runs on every target, including web-dom),
  # clipboard round-trip, persisted prefs, haptics, and the native file
  # pickers — one form, one screenshot. The strict OS clipboard assertion lives in
  # scripts/clipboard-roundtrip.yaml (macOS + Android only; headless Linux has no system
  # clipboard). The save/open pickers answer with a temp path (relative → app temp dir).
  - navigate: { route: services }
  - assert_route: { route: services }
  - assert_visible: { id: clipboard-field }
  # Resource (day::reactive, docs/async.md): the first fetch runs at page build. Let it settle
  # BEFORE the shot — the HTTP section leads the form now, so its readout is in frame.
  - assert_text: { id: http-res-status, text: "ok 1: 200 day-http-ok" }
  # Screenshot the pristine form BEFORE the clipboard copy: Android 13+ pops a system
  # clipboard-preview overlay on copy that lingers several seconds and would photobomb the shot.
  - screenshot:
      name: services
      title: { en: "Platform services", fr: "Services système", ar: "خدمات المنصة", zh-CN: "平台服务" }
      source: src/pages/services.rs
  - input: { id: clipboard-field, text: "day walkthrough clip" }
  - tap: { id: clipboard-copy }
  - tap: { id: clipboard-paste }
  - input: { id: prefs-field, text: "day-remembers" }
  - tap: { id: prefs-save }
  - input: { id: prefs-field, text: "overwritten" }
  - tap: { id: prefs-load }
  - assert_text: { id: prefs-value, text: "day-remembers" }
  # Clear removes the KEY, so the run hands the prefs store back the way it found it — and
  # `prefs::remove` gets covered alongside the set and get above, which nothing else exercised.
  # Loading afterwards is what proves the removal reached STORAGE: "cleared" is only what the
  # button wrote to the label, while "nothing stored yet" is the store itself answering.
  - tap: { id: prefs-clear }
  - assert_text: { id: prefs-status, key: prefs_cleared }
  - tap: { id: prefs-load }
  - assert_text: { id: prefs-status, key: prefs_missing }
  - assert_text: { id: prefs-value, key: prefs_empty }
  - assert_visible: { id: haptics-supported }
  - tap: { id: haptics-medium }
  # `#haptics-last-played` is `tr("haptics-last-played")` — a localized string, so assert by
  # key + args so it resolves in the run's locale, not a hardcoded English literal.
  - assert_text: { id: haptics-last-played, key: haptics_last_played, args: { style: "Medium" } }
  - tap: { id: haptics-success }
  - assert_text: { id: haptics-last-played, key: haptics_last_played, args: { style: "Success" } }
  # skip_on web-dom: a browser sandbox has no native file pickers or filesystem (docs/web.md).
  - tap: { id: btn-save-file, skip_on: [web-dom] }
  - assert_presented: { skip_on: [web-dom] }
  - respond: { path: "day-walkthrough.txt", skip_on: [web-dom] }
  - assert_text: { id: files-status, text: "saved:day-walkthrough.txt", skip_on: [web-dom] }
  - tap: { id: btn-open-file, skip_on: [web-dom] }
  - assert_presented: { skip_on: [web-dom] }
  - respond: { path: "day-walkthrough.txt", skip_on: [web-dom] }
  - assert_text: { id: files-status, text: "opened", skip_on: [web-dom] }
  - assert_text: { id: files-opened-name, key: files_opened, args: { name: "day-walkthrough.txt" }, skip_on: [web-dom] }
  # HTTP fetch (docs/http.md): day-part-http against a deterministic target — a one-shot
  # loopback server natively; on web-dom (where a tab can host no TCP listener) the dev
  # server's same-origin /day-http-ok endpoint answers with the identical bodies, so these
  # asserts run UNSKIPPED everywhere. The status label fills in from an async completion, so
  # assert_text's bounded retry (§14.3) covers the gap. The body is raw on purpose — identical
  # across locales.
  - tap: { id: http-fetch }
  - assert_text: { id: http-status, text: "200 day-http-ok" }
  # PATCH, await-style (docs/async.md): the demo target echoes the method into the body,
  # proving the verb crossed the platform engine (the old Android HttpURLConnection gap).
  - tap: { id: http-patch }
  - assert_text: { id: http-patch-status, text: "200 day-http-ok:PATCH" }
  # Refetch re-runs the Resource fetch asserted before the screenshot above (the attempt
  # counter proves it — a fresh fetch, not a cached readout).
  - tap: { id: http-res-refetch }
  - assert_text: { id: http-res-status, text: "ok 2: 200 day-http-ok" }
  - assert_visible: { id: http-tier }
  # The URL checker (type any http(s) URL → response headers + body size) needs live network,
  # so the walkthrough only checks its presence.
  - assert_visible: { id: http-url }
  - assert_visible: { id: http-check }
  # App-local file storage (docs/fs.md): day-part-fs through the async futures — the same
  # steps on every target, including web-dom (OPFS). Statuses are raw, identical per locale.
  - input: { id: fs-note, text: "day-fs-demo" }
  - tap: { id: fs-save }
  - assert_text: { id: fs-status, text: "saved" }
  - assert_text: { id: fs-list, text: "showcase-note.txt" }
  - tap: { id: fs-load }
  - assert_text: { id: fs-status, text: "loaded:day-fs-demo" }
  - tap: { id: fs-delete }
  - assert_text: { id: fs-status, text: "deleted" }
  - assert_text: { id: fs-list, text: "—" }

  # Pull-to-refresh (docs/pullrefresh.md): an EXTERNAL piece — and the reference CONTAINER piece —
  # native (UIRefreshControl / SwipeRefreshLayout / ArkUI Refresh) or emulated (overlay spinner +
  # overscroll gesture). The synthetic toggle begins a refresh; the page's fake reload prepends
  # rows and ends it. The status label and tier label are asserted in the run's locale.
  - navigate: { route: refresh }
  - assert_route: { route: refresh }
  - assert_visible: { id: refresh-title }
  - assert_text: { id: refresh-status, key: refresh_status_idle }
  - toggle: { id: feed-refresh, value: true }
  - assert_text: { id: refresh-status, key: refresh_status_refreshing }
  - screenshot:
      name: refresh
      title: { en: "Refresh", fr: "Actualiser", ar: "تحديث", zh-CN: "刷新" }
      source: src/pages/refresh.rs
  - pause: 2
  - assert_text: { id: refresh-status, key: refresh_status_idle }
  - assert_visible: { id: "refresh-row:12" }
  # The dayscript scroll_to step on a plain `scroll` piece: reveal an element, jump edges,
  # pin an offset (docs/scroll.md — unanimated, so each following step sees the settled offset).
  - scroll_to: { id: "refresh-row:1" }
  - scroll_to: { id: refresh-scroll, edge: bottom }
  - scroll_to: { id: refresh-scroll, x: 0, y: 100 }
  - scroll_to: { id: refresh-scroll, edge: top }

  # Bundled resources (§18.3): an image loaded by name via the native image pipeline +
  # random-access reads of embedded data through the native data API.
  - navigate: { route: resources }
  - assert_route: { route: resources }
  - assert_visible: { id: resources-numbers }
  - assert_visible: { id: resources-greeting }
  # Full-colour vector art (docs/vectors.md): every other glyph here is a monochrome symbol that
  # takes a tint, so this is the only step covering many-path authored-colour art. On android-mdc
  # it is a VectorDrawable rather than a raster. Driving the zoom REBUILDS the glyph at the new
  # size (see resources.rs), so this also covers that the art survives a resize on every backend.
  - assert_visible: { id: vector-tiger }
  # The glyph row wraps itself now (`RowFit::Wrap`), and the two segmented pickers govern every
  # glyph in it: a weight change re-resolves each source name, a size change re-frames each cell,
  # and both go through the same keyed rebuild. Driving them covers that the row survives both —
  # and the weight sweep is what caught android-mdc drawing NOTHING for an aliased weight, which
  # `assert_visible` alone cannot see (the view has a frame either way; docs/vectors.md).
  - assert_visible: { id: resources-vectors-row }
  - select: { id: vector-weight, index: 0 }
  - select: { id: vector-size, index: 3 }
  - wait_idle:
  - assert_visible: { id: resources-vectors-row }
  - select: { id: vector-weight, index: 1 }
  - select: { id: vector-size, index: 1 }
  - wait_idle:
  # A plain SVG asked for a WEIGHT it has no art for: it must resolve back to its base glyph
  # rather than draw nothing (docs/vectors.md). Only SF templates stage `__light`/`__bold`, so
  # this is the case every other glyph in the app is in.
  - assert_visible: { id: vector-aliased-weight }
  # The zoom drives the tiger alone now (the glyph row takes its size from the picker above), and
  # its top is five times what it was — past the content column the art becomes a pannable strip
  # rather than being clipped, so this covers both arrangements.
  - set_value: { id: vector-zoom, value: 1200 }
  - wait_idle:
  - assert_visible: { id: vector-tiger }
  - set_value: { id: vector-zoom, value: 96 }
  - wait_idle:
  - assert_visible: { id: vector-tiger }
  # The COMPOSED color picker (docs/colorpicker.md): Day's own panel, built from pieces and a
  # canvas, so these same steps run identically on all nine targets — including the two with no
  # native chooser to fall back on. Pressing the shade field's white corner is what proves
  # `on_tap_at` reports WHERE the press landed; Cancel then puts the tint back.
  - tap: { id: vector-tint-composed }
  - wait_idle:
  - assert_visible: { id: color-picker-panel }
  - assert_visible: { id: color-picker-shade }
  - assert_visible: { id: color-picker-hue }
  - assert_visible: { id: color-picker-presets }
  - assert_text: { id: color-picker-value, text: "#e86a3c" }
  - tap: { id: color-picker-cancel }
  - wait_idle:
  - screenshot:
      name: resources
      title: { en: "Resources", fr: "Ressources", ar: "الموارد", zh-CN: "资源" }
      source: src/pages/resources.rs

  # Genuine push/pop stack (docs/navigation.md): tapping pushes onto the path signal; the
  # native back button writes the pop back into it. current_route reports the stack's top.
  - navigate: { route: stack }
  - assert_visible: { id: stack-root }
  - screenshot: stack-root
  - tap: { id: stack-push }
  - assert_visible: { id: stack-detail }
  # assert_route sees the FULL path: selector key + the stack's segments (docs/navigation.md).
  - assert_route: { route: stack/1 }
  - screenshot:
      name: stack-detail
      title: { en: "Stack", fr: "Pile", ar: "المكدّس", zh-CN: "堆栈" }
      source: src/pages/stack.rs
  - tap: { id: stack-deeper }
  - assert_route: { route: stack/1/2 }
  - nav_back:
  - assert_route: { route: stack/1 }
  - nav_back:
  - assert_route: { route: stack }
  # Absolute route with params: anchors the selector, resets the stack, pushes the segment;
  # the destination reads ?hint= via route_param.
  - tap: { id: stack-link }
  - assert_route: { route: stack/item-42 }
  - assert_text: { id: stack-param, key: stack_param_hint, args: { hint: "linked" } }
  - nav_back:
  - assert_route: { route: stack }
  # Back interception (docs/navigation.md): push a detail, mark it dirty, then a back is
  # intercepted by on_back — a confirm dialog appears; "cancel" keeps the page, "discard" pops.
  - tap: { id: stack-push }
  - assert_route: { route: stack/1 }
  - toggle: { id: stack-dirty, value: true }
  - nav_back:
  - assert_presented: {}
  # Respond "cancel" (button 0): the guard consumed the back, so we stay on the detail.
  - respond: { button: 0 }
  - assert_route: { route: stack/1 }
  # Back again, this time confirm "discard" (button 1): the deferred pop lands.
  - nav_back:
  - assert_presented: {}
  - respond: { button: 1 }
  - assert_route: { route: stack }
  # Fullscreen cover (docs/cover.md): native modal on iOS/Android, topmost child elsewhere —
  # every backend presents it now, so these steps run everywhere.
  - tap: { id: cover-present }
  - assert_visible: { id: cover-title }
  - screenshot:
      name: cover
      title: { en: "Stack · fullscreen cover", fr: "Pile · couverture plein écran", ar: "المكدّس · غطاء ملء الشاشة", zh-CN: "堆栈 · 全屏覆盖层" }
      source: src/pages/stack.rs
  - tap: { id: cover-dismiss }
  - assert_visible: { id: stack-root }

  # Native tabs (docs/tabs.md): a selector(Tabs) bound to a signal. Tab keys are routes, so
  # navigate/assert_route select the active tab; the inner selector reports the innermost route.
  - navigate: { route: tabs }
  # Full-tree routes (docs/navigation.md): the selector key + the tab key.
  - assert_route: { route: tabs/one }
  - assert_visible: { id: tab-one-content }
  - assert_value: { id: demo-tabs, value: 0 }
  # Let the mobile push transition settle so the capture has no mid-animation sliver.
  - pause: { secs: 0.5 }
  - screenshot:
      name: tabs-one
      title: { en: "Tabs", fr: "Onglets", ar: "علامات التبويب", zh-CN: "标签页" }
      source: src/pages/tabs.rs
  - navigate: { route: two }
  - assert_route: { route: tabs/two }
  - assert_value: { id: demo-tabs, value: 1 }
  # Data-driven tabs (docs/navigation.md), NESTED inside the Details tab — two tab views deep:
  # Add grows the inner native tab strip, Remove shrinks it.
  - assert_visible: { id: dyn-tabs-title }
  - tap: { id: dyn-tab-add }
  - tap: { id: dyn-tab-add }
  - tap: { id: dyn-tab-remove }
  - screenshot: tabs-two
  - navigate: { route: three }
  - assert_route: { route: tabs/three }
  - assert_value: { id: demo-tabs, value: 2 }
  - screenshot: tabs-three

  # Text playground: semantic styles, weights, and the BUNDLED CUSTOM FONTS (docs/resources.md) —
  # the three Font::Custom families ship in fonts/ and must have been registered by the backend
  # at startup for these labels to realize.
  - navigate: { route: text }
  - assert_route: { route: text }
  - assert_visible: { id: text-title }
  - assert_visible: { id: text-emphasis }
  - assert_visible: { id: text-custom-28 }
  - assert_visible: { id: text-font-pacifico }
  - assert_visible: { id: text-font-bungee }
  - assert_visible: { id: text-font-specialelite }
  - assert_visible: { id: text-selectable }
  # Styled runs (docs/text-runs.md): one label carrying bold/italic/code/strike/colour spans. The
  # toggle below rebuilds it as a selectable backing, which on iOS is a different native class —
  # the swap has to carry the attributed text across.
  - assert_visible: { id: text-runs }
  # Markdown parsed at run time (docs/markdown.md): type into the editor, and the label under it
  # re-parses. Asserting its text proves the parse ran — the markers are gone from what the label
  # shows — and the second case proves unfinished markup stays literal instead of flickering.
  - assert_visible: { id: text-md-output }
  - input: { id: text-md-input, text: "**bold** and *italic* and `code` and [a link](https://daybrite.dev)" }
  - wait_idle:
  - assert_text: { id: text-md-output, text: "bold and italic and code and a link" }
  - input: { id: text-md-input, text: "half **open and a \\*literal\\* star" }
  - wait_idle:
  - assert_text: { id: text-md-output, text: "half **open and a *literal* star" }
  - screenshot:
      name: text
      title: { en: "Text", fr: "Texte", ar: "النص", zh-CN: "文字" }
      source: src/pages/text.rs
  # The page-wide Selectable toggle (upper-right): every text piece rebuilds out of and back
  # into `.selectable()` — on iOS that swaps each label to a read-only text view and back
  # (docs/text.md), so both arms must realize cleanly on every backend.
  - toggle: { id: text-selectable-toggle, value: false }
  - assert_visible: { id: text-selectable }
  - assert_visible: { id: text-font-pacifico }
  - assert_visible: { id: text-runs }
  - toggle: { id: text-selectable-toggle, value: true }
  - assert_visible: { id: text-selectable }
  - assert_visible: { id: text-runs }

  # Text areas (docs/textarea.md): the native multi-line editor with editable/selectable/spell-check
  # attributes and per-toolkit capability-gated toggles. Seed the markdown sample for a stable shot.
  - navigate: { route: textareas }
  - assert_route: { route: textareas }
  - assert_visible: { id: textareas-title }
  - assert_visible: { id: textareas-editor }
  - tap: { id: ta-seed-markdown }
  - wait_idle:

  # The STYLED editor (docs/texteditor.md) — the platform's rich-text view over the same
  # `StyledText` a label renders. Everything below is Day's own state: the toolbar reads and
  # writes the bound document, so what it asserts is true on all nine targets.
  - assert_visible: { id: styled-editor }
  - assert_visible: { id: ed-inspector }
  - screenshot:
      name: textareas
      title: { en: "Text areas", fr: "Zones de texte", ar: "مناطق النص", zh-CN: "文本区域" }
      source: src/pages/text_areas.rs
  # A restyle must leave the selection on the SAME characters. The web arm rebuilds its whole
  # element to apply attributes, so it has to put the selection back by offset — and when its two
  # offset directions disagreed, a bolded word came back shifted by one character per line above
  # it. The readout says which characters are selected, so this asserts it on every backend.
  - tap: { id: ed-select-word }
  - wait_idle:
  - assert_text: { id: ed-selection-text, text: "The" }
  - tap: { id: ed-bold }
  - wait_idle:
  - assert_text: { id: ed-selection-text, text: "The" }
  - tap: { id: ed-bold }
  - wait_idle:

  # Formatting with NO selection sets the typing style, which is what the next character takes.
  # The inspector reads it back out of the document, so this drives the whole round trip.
  - tap: { id: ed-bold }
  - wait_idle:
  - tap: { id: ed-italic }
  - wait_idle:
  # The three documents. `Code` is the live-highlighting one: the page re-tokenizes on every
  # text change and pushes fresh runs, which patches ATTRIBUTES rather than replacing the
  # document — so the caret survives, and the editor keeps its content.
  - select: { id: ed-document, index: 1 }
  - wait_idle:
  - assert_visible: { id: styled-editor }
  - screenshot:
      name: textareas-code
      title: { en: "Live syntax highlighting", fr: "Coloration syntaxique en direct", ar: "تلوين نحوي حي", zh-CN: "实时语法高亮" }
      source: src/pages/text_areas.rs
  # Export and read back. Every format is lossy in its own way (docs/texteditor.md); what this
  # pins is that the button produces text and the import parses it back into a document.
  - tap: { id: ed-export-md }
  - wait_idle:
  - tap: { id: ed-import }
  - wait_idle:
  - assert_visible: { id: styled-editor }
  - select: { id: ed-document, index: 0 }
  - wait_idle:
  - tap: { id: ed-export-html }
  - wait_idle:
  - assert_visible: { id: ed-export-out }

  # Toolbars (docs/toolbars.md): the MAIN WINDOW's own toolbar, so the assertions read the
  # page's live bindings rather than any on-page widget. `toolbar:` drives an item through the
  # same dispatch its native control fires; the screenshot is what shows the bar actually drew.
  # Skipped where the toolkit has no toolbar — nothing installs there, by design.
  - navigate: { route: toolbars }
  - assert_route: { route: toolbars }
  - assert_visible: { id: toolbars-title }
  # Appearance: ONE native segmented control over the persisted setting (src/commands.rs), which
  # the App menu's Appearance submenu also drives. Skipped on Qt, which reports `Cap::Appearance`
  # unsupported — the items lower DISABLED there, and the readout says so rather than the app
  # pretending the override took.
  #
  # These skip by TOOLKIT (`qt`), not by target. The gate is a capability, and every target of a
  # toolkit answers a capability identically — but Qt has THREE targets (macos-qt, linux-qt,
  # windows-qt) and GTK another three. Listing targets means the two you cannot build locally are
  # the two you forget, which is exactly how linux-qt and then windows-qt each failed CI in turn.
  # `skip_on`/`only_on` accept either form (day-cli script.rs), so prefer the toolkit.
  - toolbar: { item: tb-theme, index: 2, skip_on: [uikit, mdc, arkui, dom, qt] }
  - wait_idle:
  - assert_text: { id: toolbar-appearance, key: cmd_appearance_dark, skip_on: [uikit, mdc, arkui, dom, qt] }
  - toolbar: { item: tb-theme, index: 1, skip_on: [uikit, mdc, arkui, dom, qt] }
  - wait_idle:
  - assert_text: { id: toolbar-appearance, key: cmd_appearance_system, skip_on: [uikit, mdc, arkui, dom, qt] }
  # The recorder's transport (docs/agent.md), driven from the bar it lives in. Record two taps that
  # stay on THIS page — a replay that navigated away would take the readout with it — then stop,
  # play, pause, resume. `tb-new` is deliberately not exercised: it opens a second window, whose
  # chrome would then sit behind every later screenshot in the run.
  - assert_text: { id: toolbar-transport, key: toolbar_transport_idle, skip_on: [ios-uikit, android-mdc, harmony-arkui, web-dom] }
  - toolbar: { item: cmd-record, skip_on: [ios-uikit, android-mdc, harmony-arkui, web-dom] }
  - wait_idle:
  - assert_text: { id: toolbar-transport, key: toolbar_transport_recording, skip_on: [ios-uikit, android-mdc, harmony-arkui, web-dom] }
  - tap: { id: toolbar-seed-search, skip_on: [ios-uikit, android-mdc, harmony-arkui, web-dom] }
  - tap: { id: toolbar-clear-search, skip_on: [ios-uikit, android-mdc, harmony-arkui, web-dom] }
  - toolbar: { item: cmd-record, skip_on: [ios-uikit, android-mdc, harmony-arkui, web-dom] }
  - wait_idle:
  # Stopping JUMPS to Scripting (commands.rs): the script you just recorded is on that page, and
  # leaving the user wherever they happened to be reads as the recording having gone nowhere. The
  # jump is not itself recorded — `record::stop()` unhooks the nav observer before it runs.
  - assert_route: { route: scripting, skip_on: [ios-uikit, android-mdc, harmony-arkui, web-dom] }
  # Back to the bar for the rest of this section. The transport readout and the two taps the
  # replay below re-dispatches all live on the Toolbars page, so the playback has to run there.
  - navigate: { route: toolbars, skip_on: [ios-uikit, android-mdc, harmony-arkui, web-dom] }
  - wait_idle:
  - assert_text: { id: toolbar-transport, key: toolbar_transport_idle, skip_on: [ios-uikit, android-mdc, harmony-arkui, web-dom] }
  # Play ↔ Pause ↔ Resume on one item: the title and icon follow the run.
  - toolbar: { item: cmd-play, skip_on: [ios-uikit, android-mdc, harmony-arkui, web-dom] }
  - wait_idle:
  - assert_text: { id: toolbar-transport, key: toolbar_transport_playing, skip_on: [ios-uikit, android-mdc, harmony-arkui, web-dom] }
  - toolbar: { item: cmd-play, skip_on: [ios-uikit, android-mdc, harmony-arkui, web-dom] }
  - wait_idle:
  - assert_text: { id: toolbar-transport, key: toolbar_transport_paused, skip_on: [ios-uikit, android-mdc, harmony-arkui, web-dom] }
  - toolbar: { item: cmd-play, skip_on: [ios-uikit, android-mdc, harmony-arkui, web-dom] }
  - wait_idle:
  - assert_text: { id: toolbar-transport, key: toolbar_transport_playing, skip_on: [ios-uikit, android-mdc, harmony-arkui, web-dom] }
  # WAIT FOR THE REPLAY TO END before anything below runs. It re-dispatches the two recorded taps
  # (seed-search, then clear-search) on its own schedule, and every assertion under here reads
  # state those taps overwrite — a replayed `clear-search` landing late is what emptied
  # `toolbar-query` on macos-appkit and stomped `toolbar-last` on gtk/qt in CI. `wait_idle` cannot
  # cover it: that flushes the reactive drain, while the replay is a timed sequence still to come.
  # This assert is retryable, so it polls until `playing_signal` clears and costs nothing after.
  - assert_text: { id: toolbar-transport, key: toolbar_transport_idle, skip_on: [ios-uikit, android-mdc, harmony-arkui, web-dom] }
  # `key:`, not a literal: the search field FILTERS THE SIDEBAR on localized titles, so an English
  # query drops every row under `--locale fr` (and with them this very page). Typing a title matches
  # itself — a query is compared against each word start, and the start at 0 is the whole title.
  - toolbar: { item: day.search, key: nav_toolbars, skip_on: [ios-uikit, android-mdc, harmony-arkui, web-dom] }
  # The star is the shared Star COMMAND (src/commands.rs), not a demo toggle: it stars whichever
  # page is showing — here, Toolbars — and the page's own readout mirrors its state.
  - toolbar: { item: cmd-star, on: true, skip_on: [ios-uikit, android-mdc, harmony-arkui, web-dom] }
  - wait_idle:
  - assert_text: { id: toolbar-query, key: nav_toolbars, skip_on: [ios-uikit, android-mdc, harmony-arkui, web-dom] }
  - assert_text: { id: toolbar-star-state, key: toolbar_on, skip_on: [ios-uikit, android-mdc, harmony-arkui, web-dom] }
  # One command, four surfaces (docs/menus.md, docs/toolbars.md): the App menu's item carries the
  # state in its TITLE, so with this page starred it must now read "Unstar" — invoking it unstars,
  # and the toolbar's own readout follows without the two knowing about each other. `key:` rather
  # than a literal so the step survives the localized runs.
  - menu: { key: cmd_unstar, skip_on: [ios-uikit, android-mdc, harmony-arkui, web-dom] }
  - wait_idle:
  - assert_text: { id: toolbar-star-state, key: toolbar_off, skip_on: [ios-uikit, android-mdc, harmony-arkui, web-dom] }
  # …and back, from the menu this time, leaving the page starred for the screenshot below.
  - menu: { key: cmd_star, skip_on: [ios-uikit, android-mdc, harmony-arkui, web-dom] }
  - wait_idle:
  - assert_text: { id: toolbar-star-state, key: toolbar_on, skip_on: [ios-uikit, android-mdc, harmony-arkui, web-dom] }
  # Screenshot (docs/window-image.md): the command captures the window IN-PROCESS first and only
  # opens the save picker once it has bytes, so the picker appearing at all is what proves the
  # capture worked — a failed capture returns early and presents nothing. Dismissed rather than
  # saved: where the shot lands is the user's business, not a walkthrough's.
  - toolbar: { item: cmd-screenshot, skip_on: [ios-uikit, android-mdc, harmony-arkui, web-dom] }
  - assert_presented: { skip_on: [ios-uikit, android-mdc, harmony-arkui, web-dom] }
  - respond: { dismiss: true, skip_on: [ios-uikit, android-mdc, harmony-arkui, web-dom] }
  # Adding an item is just a different list: tick the switch, then the new item is drivable —
  # which the `toolbar:` step itself proves, since it fails on an absent or disabled item.
  #
  # Its READOUT is deliberately not asserted. `tb-extra` copies to the clipboard and only writes
  # the readout when that succeeds, and on Linux day-part-clipboard shells out to wl-copy/xclip —
  # neither of which a CI runner has, so the write fails and the readout is never written. That is
  # the same constraint this file already records for the clipboard round-trip above ("headless
  # Linux has no system clipboard"), which is why the strict assertion lives in
  # dayscript/clipboard-roundtrip.yaml, gated to macOS + Android. Asserting it here made linux-gtk
  # and linux-qt fail on a capability the step is not about.
  - toggle: { id: toolbar-extra-switch, value: true, skip_on: [ios-uikit, android-mdc, harmony-arkui, web-dom] }
  - wait_idle:
  - toolbar: { item: tb-extra, skip_on: [ios-uikit, android-mdc, harmony-arkui, web-dom] }
  # Disabling one item patches only that item — `toolbar:` refuses a disabled command.
  - toggle: { id: toolbar-enabled-switch, value: false, skip_on: [ios-uikit, android-mdc, harmony-arkui, web-dom] }
  - wait_idle:
  - tap: { id: toolbar-clear-search, skip_on: [ios-uikit, android-mdc, harmony-arkui, web-dom] }
  - wait_idle:
  - assert_text: { id: toolbar-query, key: toolbar_query_empty, skip_on: [ios-uikit, android-mdc, harmony-arkui, web-dom] }
  # The search field also filters the SIDEBAR by localized word-prefix (docs/localization.md
  # "Searching"). Navigating while filtered proves the row set and the selection can change
  # together without stranding the detail pane — the bug the nav derive effect now closes. The
  # query is the Stack destination's own localized title, so the row it navigates to is in the
  # filtered set in EVERY locale; the word-prefix behaviour itself is pinned by day-l10n's tests.
  - toolbar: { item: day.search, key: nav_stack, skip_on: [ios-uikit, android-mdc, harmony-arkui, web-dom] }
  - wait_idle:
  - navigate: { route: stack }
  - assert_route: { route: stack }
  - assert_visible: { id: stack-root }
  - screenshot:
      name: toolbars-filtered
      title: { en: "Toolbars · sidebar search", fr: "Barres d'outils · recherche dans la barre latérale", ar: "أشرطة الأدوات · البحث في الشريط الجانبي", zh-CN: "工具栏 · 侧边栏搜索" }
      source: src/pages/toolbars.rs
  # Clearing the query restores every row, and the page opened while filtered is still there.
  - toolbar: { item: day.search, text: "", skip_on: [ios-uikit, android-mdc, harmony-arkui, web-dom] }
  - wait_idle:
  - assert_route: { route: stack }
  - navigate: { route: toolbars }
  - wait_idle:
  - screenshot:
      name: toolbars
      title: { en: "Toolbars", fr: "Barres d'outils", ar: "أشرطة الأدوات", zh-CN: "工具栏" }
      source: src/pages/toolbars.rs
  # Unstar now that the shot has it. The starred set is written through to prefs
  # (`showcase.starred`, src/commands.rs), so a run that ENDS starred is a run that changed the
  # machine: the next launch opens with Toolbars sorted to the top of the sidebar, and every
  # screenshot taken after this page carries that reordered sidebar. `on: false` is a desired
  # STATE rather than a flip — the item's action compares it against `checked`
  # (src/pages/toolbars.rs) — so it restores whether or not the page is currently starred, and it
  # completes the surface matrix: starred from the toolbar, unstarred and restarred from the menu,
  # unstarred from the toolbar.
  - toolbar: { item: cmd-star, on: false, skip_on: [ios-uikit, android-mdc, harmony-arkui, web-dom] }
  - wait_idle:
  - assert_text: { id: toolbar-star-state, key: toolbar_off, skip_on: [ios-uikit, android-mdc, harmony-arkui, web-dom] }

  # Tweaks (docs/tweaks.md): packaged per-toolkit native configuration of built-in pieces, plus
  # NativeRef liveness — unmounting the Tweaked Piece clears the ref (asserted via Fluent keys
  # so the same script passes in every locale).
  - navigate: { route: tweaks }
  - assert_route: { route: tweaks }
  - assert_visible: { id: tweaks-title }
  - assert_visible: { id: tweak-bezel-toolbar }
  - assert_visible: { id: tweak-tooltip-button }
  - assert_visible: { id: tweak-ticks-slider }
  - assert_text: { id: tweak-ref-status, key: tweaks_ref_live }
  - toggle: { id: tweak-ref-toggle, value: false }
  - assert_text: { id: tweak-ref-status, key: tweaks_ref_cleared }
  - toggle: { id: tweak-ref-toggle, value: true }
  - assert_text: { id: tweak-ref-status, key: tweaks_ref_live }
  # The inline label tweak beside a conditional backing (docs/tweaks.md "Conditional
  # backings"): flipping Selectable rebuilds the sample label — on iOS as a read-only
  # UITextView — and the tweak must land on both arms, on every backend.
  - assert_visible: { id: tweak-label-sample }
  - toggle: { id: tweak-label-selectable, value: true }
  - assert_visible: { id: tweak-label-sample }
  - toggle: { id: tweak-label-selectable, value: false }
  - assert_visible: { id: tweak-label-sample }
  - screenshot:
      name: tweaks
      title: { en: "Tweaks", fr: "Tweaks", ar: "التوليفات", zh-CN: "微调" }
      source: src/pages/tweaks.rs

  # Native web view (docs/webview.md): each toolkit's native browser. Load the project site,
  # then `pause` (runner-side — the engine must not block the UI thread) so the page finishes
  # loading before the capture. Visited LAST-ish so a heavy embedded browser can't disturb the
  # route assertions above.
  # skip_on harmony-arkui: the x86_64 emulator image ships ArkWebCore.hap with arm64-only native
  # libs (`bm install` rejects it: "the Abi type supported by the device does not match"), so the
  # Web component's engine is null — and its RosenWeb surface then wedges the window's compositor
  # for the rest of the process, staling EVERY screenshot after this page. The piece's arkui arm is
  # implemented and renders on a real device; drop this skip once the emulator image carries an
  # x86_64 engine. (measured on the API-18 x86_64 emulator, docs/harmonyos.md)
  - navigate: { route: webview, skip_on: [harmony-arkui] }
  - assert_route: { route: webview, skip_on: [harmony-arkui] }
  - assert_visible: { id: webview-title, skip_on: [harmony-arkui] }
  # web-dom embeds an <iframe>, so history is unreachable and the page says so (docs/webview.md).
  # Only that backend renders the footnote; everywhere else the piece reports Support::Native.
  - assert_visible: { id: webview-note, only_on: [web-dom] }
  - pause: { secs: 5, skip_on: [harmony-arkui] }
  # JS evaluation (docs/webview-eval.md), on the combos whose arm is written AND has an engine —
  # windows-qt ships no Qt6 WebEngine, and the other backends report Unsupported. These three
  # assertions are engine-independent: JSON.stringify's output and a TypeError's name/message are
  # spec-defined, so WebKit and V8 agree. A SyntaxError's TEXT is not, so it is not asserted here.
  - input:
      { id: webview-js, text: "1+1", only_on: [macos-appkit, ios-uikit, macos-qt, linux-qt, android-mdc] }
  - tap: { id: webview-js-run, only_on: [macos-appkit, ios-uikit, macos-qt, linux-qt, android-mdc] }
  - pause: { secs: 2, only_on: [macos-appkit, ios-uikit, macos-qt, linux-qt, android-mdc] }
  - assert_text:
      { id: webview-js-result, text: "2", only_on: [macos-appkit, ios-uikit, macos-qt, linux-qt, android-mdc] }
  - input:
      {
        id: webview-js,
        text: "throw new TypeError('boom')",
        only_on: [macos-appkit, ios-uikit, macos-qt, linux-qt, android-mdc],
      }
  - tap: { id: webview-js-run, only_on: [macos-appkit, ios-uikit, macos-qt, linux-qt, android-mdc] }
  - pause: { secs: 2, only_on: [macos-appkit, ios-uikit, macos-qt, linux-qt, android-mdc] }
  - assert_text:
      {
        id: webview-js-result,
        text: "TypeError: boom",
        only_on: [macos-appkit, ios-uikit, macos-qt, linux-qt, android-mdc],
      }
  - screenshot:
      name: webview
      skip_on: [harmony-arkui]
      title: { en: "Web view", fr: "Vue Web", ar: "عرض الويب", zh-CN: "网页视图" }
      source: src/pages/webview.rs
  # Session retention (docs/webview.md): plant a marker in the LIVE JS context, leave the page
  # entirely, come back, and read it. It only survives if the native engine was retained rather
  # than rebuilt — a reloaded page would have a fresh, empty `window`.
  #
  # Runs AFTER the gallery screenshot above, and opens by STOPPING the load, because the marker
  # lives in a document the network can still replace. `pause` cannot close that window: a load
  # commits when the origin answers, so on a cold CI runner the marker went into the outgoing
  # document and the commit took it with it — `expected "survived", found "null"`, on the first
  # of eight variants and no other. (`document.readyState` does not help either: it reads
  # "complete" for the page being replaced.) Stopping first makes the current document final, so
  # what this block measures is retention rather than the runner's luck with the network.
  - tap: { id: webview-stop, only_on: [macos-appkit, ios-uikit, macos-qt, linux-qt] }
  - pause: { secs: 1, only_on: [macos-appkit, ios-uikit, macos-qt, linux-qt] }
  - input:
      {
        id: webview-js,
        text: "window.__dayMarker = 'survived'",
        only_on: [macos-appkit, ios-uikit, macos-qt, linux-qt],
      }
  - tap: { id: webview-js-run, only_on: [macos-appkit, ios-uikit, macos-qt, linux-qt] }
  - pause: { secs: 2, only_on: [macos-appkit, ios-uikit, macos-qt, linux-qt] }
  # Prove the marker took BEFORE leaving: if this fails the plant itself lost a race, which is a
  # different fault from the retention the steps below are about.
  - input: { id: webview-js, text: "window.__dayMarker", only_on: [macos-appkit, ios-uikit, macos-qt, linux-qt] }
  - tap: { id: webview-js-run, only_on: [macos-appkit, ios-uikit, macos-qt, linux-qt] }
  - pause: { secs: 2, only_on: [macos-appkit, ios-uikit, macos-qt, linux-qt] }
  - assert_text: { id: webview-js-result, text: '"survived"', only_on: [macos-appkit, ios-uikit, macos-qt, linux-qt] }
  # Overwrite the readout before leaving. The result label is a global signal that outlives this
  # page, so leaving "survived" on screen would let the final assertion below pass on a STALE
  # label without the marker having survived anything.
  - input: { id: webview-js, text: "'left the page'", only_on: [macos-appkit, ios-uikit, macos-qt, linux-qt] }
  - tap: { id: webview-js-run, only_on: [macos-appkit, ios-uikit, macos-qt, linux-qt] }
  - pause: { secs: 2, only_on: [macos-appkit, ios-uikit, macos-qt, linux-qt] }
  - assert_text: { id: webview-js-result, text: '"left the page"', only_on: [macos-appkit, ios-uikit, macos-qt, linux-qt] }
  - navigate: { route: controls, only_on: [macos-appkit, ios-uikit, macos-qt, linux-qt] }
  - pause: { secs: 2, only_on: [macos-appkit, ios-uikit, macos-qt, linux-qt] }
  - navigate: { route: webview, only_on: [macos-appkit, ios-uikit, macos-qt, linux-qt] }
  - pause: { secs: 3, only_on: [macos-appkit, ios-uikit, macos-qt, linux-qt] }
  # The hoisted signals survived the rebuild — the editor still holds the last text typed into
  # it, which is the line that overwrote the readout before leaving.
  - assert_text:
      {
        id: webview-js,
        text: "'left the page'",
        only_on: [macos-appkit, ios-uikit, macos-qt, linux-qt],
      }
  # …and so did the engine's own JS context: reading the marker back turns the stale readout
  # into "survived", which it cannot do unless the live context outlived the page.
  - input: { id: webview-js, text: "window.__dayMarker", only_on: [macos-appkit, ios-uikit, macos-qt, linux-qt] }
  - tap: { id: webview-js-run, only_on: [macos-appkit, ios-uikit, macos-qt, linux-qt] }
  - pause: { secs: 2, only_on: [macos-appkit, ios-uikit, macos-qt, linux-qt] }
  - assert_text:
      {
        id: webview-js-result,
        text: '"survived"',
        only_on: [macos-appkit, ios-uikit, macos-qt, linux-qt],
      }
  # The Embedded tab (docs/webview.md): a whole site bundled under resource/assets/web/minisite/,
  # served through web_view_inline on the backends with a local-content arm. The status line is a
  # day label (asserted everywhere the page shows); what renders INSIDE the web view is native web
  # content dayscript cannot reach, so the screenshot is the visual record.
  - select: { id: webview-tab, index: 1, skip_on: [harmony-arkui] }
  - assert_visible: { id: webview-embedded-status, skip_on: [harmony-arkui] }
  - assert_text:
      {
        id: webview-embedded-status,
        key: webview_embedded_status_none,
        skip_on: [harmony-arkui],
      }
  - pause: { secs: 2, skip_on: [harmony-arkui] }
  - screenshot: { name: webview-embedded, skip_on: [harmony-arkui] }
  - select: { id: webview-tab, index: 0, skip_on: [harmony-arkui] }

  # Every page has now been visited, so every piece kind this app uses has been realized. A kind
  # with no renderer on this backend rendered a `⟨kind⟩` placeholder — which no other assertion can
  # see, because the app still draws and the screenshot still looks plausible. `allow:` is this
  # file's per-target gap ledger; anything outside it fails the run, so a piece losing its renderer
  # (or a toolkit feature silently not being enabled) surfaces here first.
  #
  # The empty list below is the point: on seven targets the showcase should render ZERO
  # placeholders. Lists marked (measured) came from running this step with `allow: []`; the others
  # are read from the piece crates' backend arms and will be corrected by the first CI run that
  # disagrees — the failure names the kind.
  - assert_no_placeholders:
      only_on: [macos-appkit, linux-gtk, linux-qt, macos-qt, windows-xaml]
      allow: []
  # Android ships no color chooser in the framework, in Material, or in AndroidX, so the Resources
  # page's `.native()` well has nothing to realize and draws the placeholder on purpose — with a
  # banner beside it saying so, and Day's COMPOSED panel next to it working normally
  # (docs/colorpicker.md). Same story on harmony-arkui below.
  - assert_no_placeholders:
      only_on: [android-mdc]
      allow: [day.piece.colorpicker]
  # iOS has no native combo-box control, so the piece ships no uikit arm; the showcase renders an
  # explanatory note beside the placeholder (apps/showcase/src/pages/controls.rs).
  - assert_no_placeholders:
      only_on: [ios-uikit]
      allow: [day.piece.combobox]
  # WebKitGTK is Linux-only, so the webview piece's gtk arm is compiled out on the macOS GTK
  # development combo. (measured on macos-gtk)
  - assert_no_placeholders:
      only_on: [macos-gtk]
      allow: [day.piece.webview]
  # The MinGW (windows-gnu) builds lose piece renderer registrations: the linker drops a linkme
  # static whose codegen unit exports nothing else referenced — the dead-strip gamble DESIGN.md
  # §8.2 records — and which crates survive is link-order luck (combobox and searchfield register
  # on the gtk build today, none on qt). windows-xaml links with MSVC, which keeps `#[used]`
  # statics, and stays in the zero-placeholder group above. These are the sets measured in CI;
  # shrink them when registration is made dead-strip-proof. webview is additionally absent by
  # design on windows-gtk (no WebKitGTK 6 for MinGW).
  - assert_no_placeholders:
      only_on: [windows-qt]
      allow: [day.piece.activity, day.piece.colorpicker, day.piece.combobox, day.piece.datepicker,
              day.piece.media, day.piece.searchfield, day.piece.timepicker, day.piece.webview]
  - assert_no_placeholders:
      only_on: [windows-gtk]
      allow: [day.piece.activity, day.piece.datepicker, day.piece.media, day.piece.timepicker,
              day.piece.webview]
  - assert_no_placeholders:
      only_on: [harmony-arkui]
      allow: [day.piece.activity, day.piece.colorpicker, day.piece.combobox, day.piece.media,
              day.piece.searchfield, day.piece.webview]
  # (measured on web-dom) — media() landed as a <video>, so it is deliberately NOT listed here.
  - assert_no_placeholders:
      only_on: [web-dom]
      allow: [day.piece.activity, day.piece.combobox, day.piece.datepicker, day.piece.searchfield,
              day.piece.timepicker]
