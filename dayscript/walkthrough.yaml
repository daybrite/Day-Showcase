  # Native media player (docs/media.md): an EXTERNAL piece wrapping each toolkit's native player
  # (AVPlayerView / AVPlayerViewController / QMediaPlayer / VideoView / GtkVideo / <video>). The
  # pause lets first frames of the network sample arrive; then pause playback so the captured frame
  # is stable. (On iOS/Android the bundled Lottie animation joins this page.)
  - navigate: { route: media }
  - assert_route: { route: media }
  - assert_visible: { id: media-title }
