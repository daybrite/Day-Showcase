name: showcase-list-options
description: The List Options sheet rebuilds the list with section headers, self-sizing rows and native list items.
flow:
  - navigate: { route: list }
  - wait_for: { id: list_row:1 }
  - tap: { id: list_options }
  - wait_for: { id: list_opt_sections }
  - toggle: { id: list_opt_sections, value: true }
  - tap: { id: list_options_dismiss }
  - wait_for: { id: list_section:1 }
  - screenshot: list-sections
  # Rows count items only: the third item is row 3, whatever headers sit above it.
  - select: { id: demo_list, index: 2 }
  - assert_text: { id: list_selection, key: list_selection, args: { count: 1, rows: "3" } }
  # A row drags within its own section: aimed past the end of rows 1–25, row 2 lands last there.
  - reorder: { id: demo_list, from: 1, to: 30 }
  - assert_text: { id: list_order, key: list_order, args: { rows: "1,3,4,5,6" } }
  - reorder: { id: demo_list, from: 24, to: 1 }
  - assert_text: { id: list_order, key: list_order, args: { rows: "1,2,3,4,5" } }
  # Row 100 closes the fourth section: its header pins at the top while the jump lands below it.
  - tap: { id: list_scroll_item }
  - assert_visible: { id: list_row:100 }
  - pause: { secs: 1 }
  - screenshot: list-sections-pinned
  - tap: { id: list_scroll_top }
  - tap: { id: list_options }
  - wait_for: { id: list_opt_row_height }
  - select: { id: list_opt_row_height, index: 1 }
  - select: { id: list_opt_content, index: 1 }
  - select: { id: list_opt_separators, index: 1 }
  - screenshot: list-options-sheet
  - tap: { id: list_options_dismiss }
  - wait_for: { id: list_section:1 }
  - screenshot: list-sections-items
  # Back to the page's defaults, so later scripts see the list they expect.
  - tap: { id: list_options }
  - wait_for: { id: list_opt_sections }
  - toggle: { id: list_opt_sections, value: false }
  - select: { id: list_opt_row_height, index: 0 }
  - select: { id: list_opt_content, index: 0 }
  - select: { id: list_opt_separators, index: 0 }
  - tap: { id: list_options_dismiss }
  - wait_for: { id: list_row:1 }
  - tap: { id: list_clear }
