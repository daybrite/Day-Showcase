# Day.toml: the showcase's Day manifest (docs/cli.md). `name`/`version` come from
# Cargo.toml's [package]; any [app] property can be overridden per platform ([app.ios]),
# per toolkit ([app.qt]), or per target ([app.macos-appkit]); the most specific wins.
schema = 1

[app]
id = "dev.daybrite.showcase"
# The deep-link scheme this app shipped (docs/deep-links.md). Left explicit because the
# default is the id\'s last segment, which is not what this app published.
scheme = "dayshowcase"
title = "Day Showcase"
build = 6
targets = [
  "macos-appkit",
  "macos-gtk",
  "macos-qt",
  "windows-xaml",
  "windows-qt",
  "windows-gtk",
  "linux-gtk",
  "linux-qt",
  "ios-uikit",
  "android-mdc",
  "harmony-arkui",
  "web-dom",
]

# OS permissions (docs/permissions.md). `day build` turns these into <uses-permission> entries,
# Info.plist usage descriptions, and HarmonyOS requestPermissions, the declaration every mobile OS
# requires before an app may even ask. The reason text is what the OS shows the user in its prompt.
# The Device & sensors page reads their status and the Camera page asks for the camera's; neither
# prompts during the walkthrough.
# The reasons are translated, so they live in the catalogs as `permission_<name>` messages
# (resource/locales/<tag>/app.ftl, docs/permissions.md "Localized reasons"); `true` here is the
# declaration alone.
[permissions]
camera = true
location-when-in-use = true
notifications = true
motion = true

# Bluetooth is not in Day's portable permission set (docs/permissions.md), so it goes through the
# raw escape hatch: the key is written into the iOS Info.plist verbatim. iOS 13+ reads
# NSBluetoothAlwaysUsageDescription; the older NSBluetoothPeripheralUsageDescription is deprecated.
# Its reason is the catalog's `permission_NSBluetoothAlwaysUsageDescription` message.
[permissions.raw]
ios = { NSBluetoothAlwaysUsageDescription = true }

# Launcher shortcuts (docs/deep-links.md): long-press the app icon to jump straight to a page.
# Labels are Fluent ids resolved per locale at build; routes are saved deep links.
[[shortcuts]]
route = "menus"
label = "nav_menus"

[[shortcuts]]
route = "localization"
label = "nav_localization"

# Where the app is listed (docs/store.md "Listed apps"): a store id here means the listing is
# live, so the project site shows that store's badge and links to it.
[store]
apple-app-id = "6802801331"
google-play-id = "dev.daybrite.showcase"

# The web build on a home screen (docs/web.md "Home screen and offline"). The name, the
# description, and the icons come from store/ and the icon master; the splash matches the
# icon's own background so the launch reads as one motion.
[web]
background-color = "#123246"

# The desktop window (docs/cli.md). Kept in lockstep with main.rs's WindowOptions. A scripted
# run does not open at this size: it captures at the [screenshots] size, 2560x1600 pixels by
# default, which is a 1280x800-point window at 2x and a size the Mac App Store accepts. Add a
# [screenshots] table to change that for this app.
[window]
width = 1000
height = 720

# Release signing (§16.5): values resolve from the environment at pack time: an unset variable
# degrades that section to the dev tier, loudly (ad-hoc / dev keystore / self-signed); it never
# fails the pack (§20). Populate the DAY_* variables (CI: repository secrets) to light up release
# signing; `day sign --check` reports readiness without printing any secret.
[signing.macos]
identity = "${DAY_SIGN_MACOS_IDENTITY}" # "Developer ID Application: …"

# App Store builds use the AppKit bundle. Qt/GTK remain separate development targets.
[sandbox.macos-appkit]
enabled = true
user-selected-files = "read-write"
bookmarks = true
network-client = true
# The Network & HTTP page runs its own loopback demonstration server, even in Release.
network-server = true
camera = true
location = true

[signing.macos.notarize]
key-id = "${DAY_NOTARY_KEY_ID}"
issuer = "${DAY_NOTARY_ISSUER}"
key-path = "${DAY_NOTARY_KEY}" # AuthKey_<id>.p8

[signing.ios]
team = "${DAY_APPLE_TEAM}"
key-id = "${DAY_ASC_KEY_ID}"
issuer = "${DAY_ASC_ISSUER}"
key-path = "${DAY_ASC_KEY}" # App Store Connect API key (.p8)

[signing.android]
keystore = "${DAY_ANDROID_KEYSTORE}" # path to the upload keystore
key-alias = "${DAY_ANDROID_KEY_ALIAS}"
store-pass = "${DAY_KS_PASS}"
key-pass = "${DAY_KEY_PASS}"

[signing.windows]
provider = "self-signed-dev" # → azure-artifact-signing once an account exists (§16.5)

[signing.ohos]
keystore = "${DAY_OHOS_KEYSTORE}" # .p12
key-alias = "${DAY_OHOS_KEY_ALIAS}"
store-pass = "${DAY_OHOS_KS_PASS}"
key-pass = "${DAY_OHOS_KEY_PASS}"
cert = "${DAY_OHOS_CERT}" # release .cer
profile = "${DAY_OHOS_PROFILE}" # .p7b
