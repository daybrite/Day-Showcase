# Build, test, package and release the Day Showcase with the same reusable workflow every Day app
# uses (daybrite/actions). The app's own pipeline; day's repository also builds this app from a
# checkout of it, to test the framework against the app it documents.
name: ci

on:
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "30 6,18 * * *"

permissions:
  contents: write # release assets on tags
  pages: write # deploy-web
  id-token: write # deploy-pages OIDC

jobs:
  app:
    uses: daybrite/actions/.github/workflows/dayapp.yml@main
    secrets: inherit
    with:
      targets: windows-xaml, macos-appkit, linux-gtk, linux-qt, ios-uikit, android-mdc, harmony-arkui, web-dom
      day-version: main
      scripts: dayscript/walkthrough.yaml dayscript/speech.yaml dayscript/tree.yaml
      # The gallery's variant ids: one run per theme × locale, the same matrix day's own CI drives.
      themes: light dark
      locales: en fr ar zh-CN
      # Both profiles are chosen for the store listing and for the runner's load ceiling. Load:
      # a headless runner rasterizes every pixel in software on two cores, and this app's Web
      # view page loads the live daybrite.dev (21 hero PNGs and 31 inline SVGs), which tipped a
      # 2.59 Mpx guest (`medium_phone`, 1080x2400) into freezing whole, adbd included; `pixel`
      # (1080x1920, 2.07 Mpx) is well under. The store: Google Play's API takes 1080 px on the
      # short side at least, so the shared workflow's default `medium_tablet`, which `day
      # devices boot` halves to 1280x800 past three million pixels, is refused (v0.4.13);
      # `Nexus 7 2013` captures 1920x1200 whole (2.3 Mpx) and at density 240 lays out as the
      # same 1280x800 points the walkthrough is written against.
      android-devices: |
        device=pixel,         os=36, orientation=portrait,  slug=phone
        device=Nexus 7 2013,  os=36, orientation=landscape, density=240, slug=tablet
      app-id: dev.daybrite.showcase
      deploy-web: true
      # Tag builds sign and notarize the .dmg in a job that checks out nothing and runs only
      # Apple's tools, so the Developer ID is never present where repository code runs. Needs a
      # `release-signing` environment in this repository holding DAY_MACOS_CERT_P12,
      # DAY_MACOS_CERT_PASSWORD, DAY_SIGN_MACOS_IDENTITY and the DAY_NOTARY_* trio. Setting this
      # input is what asks for signing, so a tag build fails if the material is missing rather than
      # quietly shipping a .dmg macOS refuses to open. Remove the input to release unsigned.
      signing-environment: release-signing
      # A tag build also ships the iOS app: the packed .ipa goes to App Store Connect through the
      # `release` lane `day store stage` writes from store/, which uploads the listing, waits for
      # processing, and submits the version for review (docs/store.md). The release itself waits
      # for the Release button in App Store Connect. Needs this repository's DAY_APPLE_TEAM,
      # DAY_ASC_KEY_ID, DAY_ASC_ISSUER, DAY_ASC_KEY_B64, DAY_APPLE_CERT_P12,
      # DAY_APPLE_CERT_PASSWORD and DAY_IOS_PROFILE_B64 secrets.
      upload-ios: "true"
      ios-upload-lane: ios release
      # The same for Google Play: the packed .aab goes to the production track as a completed
      # release, which is Play's submission; Google reviews it and rolls it out on approval. Needs
      # DAY_PLAY_JSON_KEY (the service-account JSON) beside the DAY_ANDROID_* keystore secrets,
      # and the keystore must be the upload key Play App Signing was enrolled with.
      upload-play: "true"
      play-upload-lane: android release
      # Both uploads replace the stores' screenshots with the eight the walkthrough marks
      # `store: N`, taken from this run's own screenshot artifacts and checked against each
      # store's sizes first (daybrite/actions README, Store screenshots).
      store-screenshots: true

  # The Content List page copies the `day new` scaffold's list, editor and model
  # (scripts/template-sync.sh). A template change that is not mirrored here fails the build.
  template-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: daybrite/day
          ref: main
          path: day-checkout
      - run: scripts/template-sync.sh --check day-checkout
