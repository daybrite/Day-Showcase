<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="1024" height="1024">
  <defs>
    <linearGradient id="g" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#E8541C"></stop>
      <stop offset="1" stop-color="#FFD84D"></stop>
    </linearGradient>
  </defs>
  <!-- Full-bleed backdrop (day icon master format, docs/icons.md): platforms apply their own
       masks, so the square carries no baked corner radius. -->
  
  <g id="day:foreground">
    <g stroke="#FFD84D" stroke-width="6" stroke-linecap="round">
      <line x1="60" y1="48" x2="60" y2="30"></line>
      <line x1="60" y1="48" x2="60" y2="40" transform="rotate(20 60 78)"></line>
      <line x1="60" y1="48" x2="60" y2="40" transform="rotate(-20 60 78)"></line>
      <line x1="60" y1="48" x2="60" y2="30" transform="rotate(40 60 78)"></line>
      <line x1="60" y1="48" x2="60" y2="30" transform="rotate(-40 60 78)"></line>
      <line x1="60" y1="48" x2="60" y2="40" transform="rotate(60 60 78)"></line>
      <line x1="60" y1="48" x2="60" y2="40" transform="rotate(-60 60 78)"></line>
      <line x1="60" y1="48" x2="60" y2="30" transform="rotate(80 60 78)"></line>
      <line x1="60" y1="48" x2="60" y2="30" transform="rotate(-80 60 78)"></line>
    </g>
    <path d="M38 78 A22 22 0 0 1 82 78 Z" fill="url(#g)" stroke="url(#g)" stroke-width="5" stroke-linejoin="round"></path>
    <line x1="28" y1="90" x2="92" y2="90" stroke="#FF8A3C" stroke-width="4" stroke-linecap="round"></line>
    <line x1="38" y1="98" x2="82" y2="98" stroke="#FF8A3C" stroke-width="4" stroke-linecap="round"></line>
  </g>
  <!-- Single-color silhouette for the themed/tinted modes (Android 13 themed icon, Icon
       Composer's Tinted appearance): solid paint only — the platform supplies the color, and
       the VectorDrawable subset takes no gradients. Hidden so plain viewers (and the
       composite) show the icon as shipped; the pipeline re-enables it. -->
  
</svg>
