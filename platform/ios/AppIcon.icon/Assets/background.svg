<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="1024" height="1024">
  <defs>
    <linearGradient id="g" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#E8541C"></stop>
      <stop offset="1" stop-color="#FFD84D"></stop>
    </linearGradient>
  </defs>
  <!-- Full-bleed backdrop (day icon master format, docs/icons.md): platforms apply their own
       masks, so the square carries no baked corner radius. -->
  <rect id="day:background" x="0" y="0" width="120" height="120" fill="#123246"></rect>
  
  <!-- Single-color silhouette for the themed/tinted modes (Android 13 themed icon, Icon
       Composer's Tinted appearance): solid paint only — the platform supplies the color, and
       the VectorDrawable subset takes no gradients. Hidden so plain viewers (and the
       composite) show the icon as shipped; the pipeline re-enables it. -->
  
</svg>
