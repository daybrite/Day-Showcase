[package]
name = "showcase"
publish = false
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
authors = ["Daybrite <hello@daybrite.dev>"]
repository = "https://github.com/daybrite/Day-Showcase"
homepage = "https://daybrite.dev"
# Generate typed resource constants (`res::images::…`, `res::assets::…`, `res::fonts::…`) from
# `resource/` on every build (§18.5) — dogfoods day-build; see build.rs and the `res` module in lib.rs.
build = "build.rs"

# Each backend line is JUST the `day/<backend>` toolkit. The Day CLI derives every standalone piece's
# `<pkg>/<backend>` renderer feature from `[package.metadata.day.piece]` and unions it into the build
# (Tier A.2) — so adding a piece is a plain git dependency below, with no per-backend
# feature fan-out here. (Building with bare `cargo` still works: run through `day build` so the union
# is applied, or add the piece features by hand.)
[features]
# Exactly one backend per binary (day/DESIGN.md §3.2). `default` picks the headless `mock` backend so
# bare `cargo` / `cargo clippy` / rust-analyzer build out of the box; every real build goes
# through `day build`, which passes `--no-default-features --features <backend>` (see day-cli), so the
# mock default is stripped and never unifies with the selected backend.
default = ["mock"]
appkit = ["day/appkit", "dep:day-appkit", "day-tweak-button-bezel/appkit", "day-tweak-tooltip/appkit", "day-tweak-slider-tickmarks/appkit"]
gtk = ["day/gtk", "day-tweak-tooltip/gtk", "day-tweak-slider-tickmarks/gtk"]
qt = ["day/qt", "day-tweak-slider-tickmarks/qt"]
uikit = ["day/uikit", "dep:day-uikit"]
mdc = ["day/mdc", "day-tweak-tooltip/mdc", "day-tweak-slider-tickmarks/mdc"]
xaml = ["day/xaml", "day-tweak-slider-tickmarks/xaml"]
arkui = ["day/arkui", "day-tweak-slider-tickmarks/arkui"]
# The web backend (day/DESIGN.md §9). No tweak crate has a dom renderer yet, so the line is bare.
dom = ["day/dom"]
mock = ["day/mock"]

# rlib for the desktop bin; the iOS staticlib and Android cdylib are requested explicitly by
# the mobile pipeline via `cargo rustc --crate-type` (day-cli mobile.rs). Keeping cdylib here
# would make every desktop build emit it too — and a Rust cdylib blows past the PE export cap
# on the windows-gnu ABI (windows-gtk / windows-qt): "too many exported symbols, max 65535".
[lib]
crate-type = ["rlib"]

[build-dependencies]
# Resource-constant codegen (§18.5) — the same crate a scaffolded app's build.rs uses.
day-build = { git = "https://github.com/daybrite/day.git" }

[dependencies]
day = { git = "https://github.com/daybrite/day.git" }
# Consent-first crash reporting (docs/break.md) — the Crash Reporting page arms it and shows the
# previous run's report. Optional in general; here it demonstrates the whole flow. Its consent UI
# (`ui` feature, on by default) is built from ordinary pieces, so no per-backend wiring is needed.
day-break = { git = "https://github.com/daybrite/day.git" }
# A HEADLESS capability crate (no UI Piece): app Rust code calls day_part_battery::status() directly.
day-part-battery = { git = "https://github.com/daybrite/day.git" }
day-part-sensors = { git = "https://github.com/daybrite/day.git" }
day-part-permissions = { git = "https://github.com/daybrite/day.git" }
day-part-location = { git = "https://github.com/daybrite/day.git" }
day-part-clipboard = { git = "https://github.com/daybrite/day.git" }
day-part-network = { git = "https://github.com/daybrite/day.git" }
day-piece-combobox = { git = "https://github.com/daybrite/day.git" }
# A COMPOSE piece (pure composition — no native code, no cargo features): a plain dep, available on
# every backend for free. No per-backend feature wiring above, the composition-first payoff.
day-piece-rating = { git = "https://github.com/daybrite/day.git" }
day-piece-pullrefresh = { git = "https://github.com/daybrite/day.git" }
day-piece-datetime = { git = "https://github.com/daybrite/day.git" }
# Tweaks (docs/tweaks.md): packaged per-toolkit configuration of built-in pieces.
day-tweak-button-bezel = { git = "https://github.com/daybrite/day.git" }
# The Apple toolkit crates directly, for the Tweaks page's INLINE `.appkit(…)`/`.uikit(…)`
# label card (docs/tweaks.md "Per-toolkit access") — each rides only its backend's feature.
day-appkit = { git = "https://github.com/daybrite/day.git", optional = true }
day-uikit = { git = "https://github.com/daybrite/day.git", optional = true }
day-tweak-tooltip = { git = "https://github.com/daybrite/day.git" }
day-tweak-slider-tickmarks = { git = "https://github.com/daybrite/day.git" }
day-piece-webview = { git = "https://github.com/daybrite/day.git" }
day-piece-media = { git = "https://github.com/daybrite/day.git" }
day-part-haptics = { git = "https://github.com/daybrite/day.git" }
# Local notifications (docs/notify.md): the Platform Services page posts and schedules them.
day-part-local-notify = { git = "https://github.com/daybrite/day.git" }
# day-part-prefs is no longer a direct dependency: it arrives through the day facade as
# `day::prefs` (docs/prefs.md).
day-piece-settings = { git = "https://github.com/daybrite/day.git" }
day-part-deviceinfo = { git = "https://github.com/daybrite/day.git" }
day-part-http = { git = "https://github.com/daybrite/day.git" }
day-part-fs = { git = "https://github.com/daybrite/day.git" }
day-piece-activity = { git = "https://github.com/daybrite/day.git" }
day-piece-searchfield = { git = "https://github.com/daybrite/day.git" }
day-piece-map = { git = "https://github.com/daybrite/day.git" }
# day-piece-lottie is iOS/Android only; the front-end compiles everywhere but the `lottie` page is
# `#[cfg]`-gated to those targets. Its backend features are enabled only in `uikit`/`mdc`.
day-piece-lottie = { git = "https://github.com/daybrite/day.git" }
# SwiftUI embedding (docs/swiftui.md): hosts the swiftui/ package's views on the Benchmark page.
# Apple-native only, but a plain dep with no cfg anywhere — the front-end compiles on every
# backend and `day_piece_swiftui::support()` gates the UI, so no placeholder can ever realize.
day-piece-swiftui = { git = "https://github.com/daybrite/day.git" }

[[bin]]
name = "showcase"
path = "src/main.rs"

# Its own workspace root, which is what `day new app` generates too. Without this, cloning the app
# into a directory that is itself a cargo workspace — daybrite/day's CI checks it out inside the
# framework checkout — makes cargo walk up, find that workspace, and refuse to build a package the
# workspace does not list as a member.
[workspace]

# --- SwiftUI embedding (docs/swiftui.md): the app's own SwiftPM package ---
# `day build` wires swiftui/ into the generated DayPieces module on each Apple leg (with its
# transitive SwiftPM dependencies) and generates hosting glue for its public views; day-build
# (build.rs) generates the matching typed Rust constructors, surfaced as `crate::swiftui::*` in
# lib.rs. `products` is named because the library product ("ShowcaseSwiftUI") differs from the
# directory ("swiftui"); `platform` raises the deployment floor — SwiftUI `Grid` needs iOS 16 /
# macOS 13 — which `day build` conveys to xcodebuild / `swift build` without touching scaffolds.
[package.metadata.day.ios]
swift-packages = [{ path = "swiftui", products = ["ShowcaseSwiftUI"] }]
platform = "16.0"

[package.metadata.day.macos]
swift-packages = [{ path = "swiftui", products = ["ShowcaseSwiftUI"] }]
platform = "13.0"
