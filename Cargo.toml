[package]
name = "day-showcase"
version.workspace = true
edition = "2024"
license = "Apache-2.0"
authors = ["Daybrite <hello@daybrite.dev>"]
repository = "https://github.com/daybrite/Day-Showcase"
homepage = "https://daybrite.dev"
# Generate typed resource constants (`res::images::…`, `res::assets::…`, `res::fonts::…`) from
# `resource/` on every build (§18.5), which dogfoods day-build; see build.rs and the `res` module
# in lib.rs.
build = "build.rs"

[features]
# Exactly one backend per binary (day/DESIGN.md §3.2). `default` picks the headless `mock` backend so
# bare `cargo` / `cargo clippy` / rust-analyzer build out of the box; every real build goes
# through `day build`, which passes `--no-default-features --features <backend>` (see day-cli), so the
# mock default is stripped and never unifies with the selected backend.
default = ["mock"]
appkit = ["day/appkit", "dep:day-toolkit-appkit", "day-tweak-button-bezel/appkit", "day-tweak-tooltip/appkit", "day-tweak-slider-tick-marks/appkit", "day-tweak-tree-style/appkit"]
gtk = ["day/gtk", "day-tweak-tooltip/gtk", "day-tweak-slider-tick-marks/gtk", "day-tweak-tree-style/gtk"]
qt = ["day/qt", "day-tweak-slider-tick-marks/qt"]
uikit = ["day/uikit", "dep:day-toolkit-uikit"]
material = ["day/material", "day-tweak-tooltip/material", "day-tweak-slider-tick-marks/material"]
xaml = ["day/xaml", "day-tweak-slider-tick-marks/xaml"]
# WinUI 3 (windows-winui): the xaml backend built against the Windows App SDK. The tweak crates
# with a WinUI half are enabled as on xaml.
winui = ["day/winui", "day-tweak-slider-tick-marks/winui"]
arkui = ["day/arkui", "day-tweak-slider-tick-marks/arkui"]
# The web backend (day/DESIGN.md §9). No tweak crate has a dom renderer yet, so the line is bare.
dom = ["day/dom"]
mock = ["day/mock"]

# rlib for the desktop bin; the iOS staticlib and Android cdylib are requested explicitly by
# the mobile pipeline via `cargo rustc --crate-type` (day-cli mobile.rs). Keeping cdylib here
# would make every desktop build emit it too.
[lib]
# A constant name, not the package's. Every artifact Day stages is named after the lib target
# (`libdayapp.a` for the iOS/macOS staticlib, `libdayapp.so` for the Android cdylib, and the
# `dayapp::` path `src/main.rs` imports), so none of them move when the package is renamed.
# Renaming this app is a one-line edit to `[package] name` above (DESIGN.md §17.5).
name = "dayapp"
crate-type = ["rlib"]

[build-dependencies]
# Resource-constant codegen (§18.5): the same crate a scaffolded app's build.rs uses.
day-build = "0.6"

[dependencies]
day = { package = "day-app", version = "0.6", features = ["model"] }
# The Content List page persists its items as one JSON blob in `day::prefs`, exactly as the
# scaffold it copies does (src/pages/content_list/model.rs).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Consent-first crash reporting (docs/break.md): the Crash Reporting page arms it and shows the
# previous run's report. Optional in general; here it demonstrates the whole flow. Its consent UI
# (`ui` feature, on by default) is built from ordinary pieces, so no per-backend wiring is needed.
day-piece-crash-reporter = "0.1"
# A headless capability crate (no UI Piece): app Rust code calls day_part_device::battery::status()
# directly.
day-part-device = "0.6"
# daybridge's reference part (docs/bridge.md): one API, a different language per platform. The
# first part in its own repository, published on crates.io like the day-piece-lottie gallery
# below. `day patch --local ../day-part-speech` builds against a checkout of it.
day-part-speech = "0.4"
day-part-sensors = "0.6"
day-part-permissions = "0.6"
day-part-location = "0.6"
day-part-clipboard = "0.6"
day-part-connectivity = "0.6"
# A compose piece (pure composition, without native code or cargo features): a plain dep,
# available on every backend with no extra work. It needs no per-backend feature wiring above,
# which is the composition-first payoff.
# The color picker (docs/colorpicker.md): the Resources page opens it in both idioms, the
# platform's chooser and Day's composed panel, which is the same picker on every target.
# The styled-text editor (docs/texteditor.md): the Text areas page edits a formatted note and a
# live-highlighted code sample in each platform's rich-text view.
day-piece-text-editor = "0.6"
# Tweaks (docs/tweaks.md): packaged per-toolkit configuration of built-in pieces.
day-tweak-button-bezel = "0.6"
# The Apple toolkit crates directly, for the Tweaks page's inline `.appkit(…)`/`.uikit(…)`
# label card (docs/tweaks.md "Per-toolkit access"); each rides only its backend's feature.
day-toolkit-appkit = { version = "0.6", optional = true }
day-toolkit-uikit = { version = "0.6", optional = true }
day-tweak-tooltip = "0.6"
day-tweak-slider-tick-marks = "0.6"
# The Tree page's sidebar styling (docs/tweaks.md): native no-ops outside appkit/gtk.
day-tweak-tree-style = "0.6"
day-piece-webview = "0.4"
day-piece-media = "0.4"
day-part-haptics = "0.6"
# Sound effects (docs/sound.md): the Speech, sound & haptics page plays bundled clips.
day-part-sound = "0.6"
# Local notifications (docs/notify.md): the Platform Services page posts and schedules them.
day-part-local-notify = "0.6"
# day-part-preferences is no longer a direct dependency: it arrives through the day facade as
# `day::prefs` (docs/prefs.md).
day-piece-settings = "0.6"
day-part-http = { version = "0.6", features = ["reqwest"] }
# The download manager (docs/downloads.md): the Networking page's pausable, resumable download.
day-part-downloads = "0.6"
day-part-filesystem = "0.6"
# The keychain and the biometric prompt (docs/keychain.md, docs/biometrics.md): the Security page
# stores an item at each protection level and shows the platform's own verification dialog.
day-part-keychain = "0.6"
day-part-biometrics = "0.6"
# Sign-in (day-part-auth): the Sign-in page's auth browser, OpenID Connect client, passkeys, Sign
# in with Apple and Google. Its own repository, like speech.
day-part-auth = "0.1"
# The Lottie page mounts day-piece-lottie's own example pages and animations (its Lottie Demo app
# is a sidebar of the same ones), so the two apps show one copy of the code and one set of files.
# The gallery's animations arrive in this bundle as its data assets, and it forwards the player's
# backend features itself: no per-backend feature line here, no animation under resource/. The
# player renders on every backend that has an engine to draw with (Airbnb's own players on iOS
# and Android, lottie-web in a day-piece-webview elsewhere); the page is `#[cfg]`-gated away only
# on `macos-gtk`, which ships no WebKitGTK to host it. From crates.io like the other pieces;
# `day patch --local ../day-piece-lottie` builds against a checkout.
day-piece-lottie-gallery = "0.1"
# The Charts page mounts day-piece-charts' own example pages (its Charts Demo app is a sidebar of
# the same ones), so the two apps show one copy of the code. A library of pages with a private
# string catalog: nothing to wire per backend, and its strings resolve here without being
# installed. A bare git line, like lottie's; `day patch --local ../day-piece-charts` builds
# against a checkout.
day-piece-charts = "0.4"
day-piece-charts-gallery = "0.1"
# day-piece-camera renders on iOS, Android and HarmonyOS; the front-end compiles everywhere and
# `day_piece_camera::support()` decides at run time whether the Camera page is listed. Its own
# repository, like lottie: a bare git line, and `day patch --local ../day-piece-camera` builds
# against a checkout.
day-piece-camera = "0.1"
# The last photo the Camera page took is shown through the bytes-backed image piece.
# SwiftUI embedding (docs/swiftui.md): hosts the swiftui/ package's views on the Benchmark page.
# Apple-native only, but a plain dep with no cfg anywhere: the front-end compiles on every
# backend and `day_piece_swiftui::support()` gates the UI, so no placeholder can ever realize.
day-piece-swiftui = "0.6"


# Its own workspace root, which is what `day new app` generates too. Without this, cloning the app
# into a directory that is itself a cargo workspace (daybrite/day's CI checks it out inside the
# framework checkout) makes cargo walk up, find that workspace, and refuse to build a package the
# workspace does not list as a member.
[workspace]

# --- SwiftUI embedding (docs/swiftui.md): the app's SwiftPM package ---
# `day build` wires swiftui/ into the generated DayPieces module on each Apple leg (with its
# transitive SwiftPM dependencies) and generates hosting glue for its public views; day-build
# (build.rs) generates the matching typed Rust constructors, surfaced as `crate::swiftui::*` in
# lib.rs. `products` is named because the library product ("ShowcaseSwiftUI") differs from the
# directory ("swiftui"); `platform` raises the deployment floor (SwiftUI `Grid` needs macOS 13),
# which `day build` conveys to xcodebuild / `swift build` without touching scaffolds. iOS names no
# floor: the package runs on the app's own iOS 15, drawing the patchwork with stacks where `Grid`
# (iOS 16) is missing.
[package.metadata.day.ios]
swift-packages = [{ path = "swiftui", products = ["ShowcaseSwiftUI"] }]

[package.metadata.day.macos]
swift-packages = [{ path = "swiftui", products = ["ShowcaseSwiftUI"] }]
platform = "13.0"

# The Model page persists through a real SQLite container on every native target; the web build
# stays in memory (rusqlite has no place in the wasm binary), so the engine is target-gated.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
day-persistence = "0.1"
# The Sign-in page's demo provider is a loopback HTTP server inside the app, which a browser page
# cannot run; the web build signs in to a provider you name instead.
day-part-auth = { version = "0.1", features = ["demo-provider"] }

[workspace.package]
version = "0.5.1"
