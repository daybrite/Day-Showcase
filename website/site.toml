# Day Showcase website (https://showcase.daybrite.dev/) — built by the shared build-day-app
# workflow from the daybrite/daysite template. Content (name, description, screenshots,
# downloads) comes from Day.toml, store/, and the release pipeline; this file holds only what
# is genuinely site-specific.

# Custom domain: the deploy emits a CNAME for any non-github.io host, and the base path is "/".
host = "https://showcase.daybrite.dev"
locales = ["en", "fr", "ar", "zh-CN"]

# The daybrite brand orange (the web-dom accent from daybrite.dev's palette).
accent-color = "#ff9500"

# The live build is the whole point of a showcase: hosted at /webapp/, preselected in the picker.
webapp = "webapp"
default-platform = "web"

# Gallery curation: the SAME rows, titles, and column order as daybrite.dev's gallery
# (daybrite/day website/gallery.config.mjs) — daybrite.dev references this site's published
# screenshots through /gallery/gallery.json, so the two galleries must describe the same set.
# A change to either list belongs in both.
#
# Row order is the Showcase's own sidebar (alphabetical by English title, src/lib.rs
# `destinations()`), with `home` leading and each in-page state following the page it is
# reached from. The walkthrough captures a few more shots than these (benchmark-dense,
# benchmark-swiftui); leaving them unlisted keeps them in the CI artifacts but out of the site.
[gallery]
platforms = [
  "ios-uikit",
  "android-mdc",
  "harmony-arkui",
  "macos-appkit",
  "windows-xaml",
  "linux-qt",
  "linux-gtk",
  "web-dom",
]

[[gallery.shots]]
id = "home"
title = "Home"
source = "src/lib.rs"

[[gallery.shots]]
id = "about"
title = "About"
source = "src/pages/about.rs"

